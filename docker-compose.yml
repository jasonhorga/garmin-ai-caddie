services:
  api:
    build: .
    # A failed boot must stop after a small, observable number of attempts.
    # Infinite retries turn a dependency outage into a host-wide resource storm.
    restart: "on-failure:3"
    init: true
    stop_grace_period: 30s
    mem_limit: ${AI_CADDIE_API_MEMORY_LIMIT:-2g}
    cpus: ${AI_CADDIE_API_CPUS:-2.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      AI_CADDIE_SECURITY_PROFILE: ${AI_CADDIE_SECURITY_PROFILE:-private}
      # No baked-in default: a deploy that forgets the .env override must FAIL CLOSED (start_api.sh
      # refuses a private/staging/production profile with an empty token) rather than come up
      # protected only by a public well-known constant.
      AI_CADDIE_ADMIN_TOKEN: ${AI_CADDIE_ADMIN_TOKEN:-}
      # Sign in with Apple: the iOS bundle id (+ later the web Services ID) is the token audience;
      # the admin-email allowlist links the owner's first Apple sign-in to the OWNER role.
      AI_CADDIE_APPLE_BUNDLE_ID: ${AI_CADDIE_APPLE_BUNDLE_ID:-}
      AI_CADDIE_ADMIN_APPLE_EMAILS: ${AI_CADDIE_ADMIN_APPLE_EMAILS:-}
      AI_CADDIE_DATA_MODE: ${AI_CADDIE_DATA_MODE:-local_or_fixture}
      AI_CADDIE_BUILD_REVISION: ${AI_CADDIE_BUILD_REVISION:-local}
      AI_CADDIE_CORS_ORIGINS: ${AI_CADDIE_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      AI_CADDIE_CORS_ORIGIN_REGEX: ${AI_CADDIE_CORS_ORIGIN_REGEX:-}
      AI_CADDIE_LLM_PROVIDER: ${AI_CADDIE_LLM_PROVIDER:-static}
      AI_CADDIE_PRIVATE_ROOT: /var/lib/ai-caddie
      AI_CADDIE_TOPO_CACHE_DIR: /var/lib/ai-caddie/topo_render_cache
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_OAUTH_CREDENTIALS_B64: ${GEMINI_OAUTH_CREDENTIALS_B64:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_CADDIE_DATABASE_URL: postgresql+psycopg://aicaddie:${AI_CADDIE_DB_PASSWORD:-aicaddie}@db:5432/aicaddie
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AI_CADDIE_API_PUBLISH_HOST:-127.0.0.1}:9000:9000"
    volumes:
      - ai-caddie-private:/var/lib/ai-caddie
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/v2/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    # Recover transient database crashes, but do not loop forever when the
    # data directory or host is unhealthy.
    restart: "on-failure:5"
    stop_grace_period: 60s
    mem_limit: ${AI_CADDIE_DB_MEMORY_LIMIT:-1g}
    cpus: ${AI_CADDIE_DB_CPUS:-1.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: aicaddie
      POSTGRES_PASSWORD: ${AI_CADDIE_DB_PASSWORD:-aicaddie}
      POSTGRES_DB: aicaddie
    volumes:
      - ai-caddie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicaddie"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: node:24-bookworm-slim
    working_dir: /app/web_v2
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_AI_CADDIE_API_BASE_URL: ${VITE_AI_CADDIE_API_BASE_URL:-http://127.0.0.1:9000}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/web_v2/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai-caddie-private:
  web-node-modules:
  ai-caddie-pgdata:

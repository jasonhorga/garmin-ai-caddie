services:
  api:
    build: .
    restart: unless-stopped
    environment:
      AI_CADDIE_SECURITY_PROFILE: ${AI_CADDIE_SECURITY_PROFILE:-private}
      AI_CADDIE_ADMIN_TOKEN: ${AI_CADDIE_ADMIN_TOKEN:-local-admin-token}
      AI_CADDIE_DATA_MODE: ${AI_CADDIE_DATA_MODE:-local_or_fixture}
      AI_CADDIE_CORS_ORIGINS: ${AI_CADDIE_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      AI_CADDIE_CORS_ORIGIN_REGEX: ${AI_CADDIE_CORS_ORIGIN_REGEX:-}
      AI_CADDIE_LLM_PROVIDER: ${AI_CADDIE_LLM_PROVIDER:-static}
      AI_CADDIE_PRIVATE_ROOT: /var/lib/ai-caddie
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_OAUTH_CREDENTIALS_B64: ${GEMINI_OAUTH_CREDENTIALS_B64:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${AI_CADDIE_API_PUBLISH_HOST:-127.0.0.1}:9000:9000"
    volumes:
      - ai-caddie-private:/var/lib/ai-caddie
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/v2/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:24-bookworm-slim
    working_dir: /app/web_v2
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_AI_CADDIE_API_BASE_URL: ${VITE_AI_CADDIE_API_BASE_URL:-http://127.0.0.1:9000}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/web_v2/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  ai-caddie-private:
  web-node-modules:

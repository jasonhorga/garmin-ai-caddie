name: AICaddieNative

options:
  bundleIdPrefix: com.ai-caddie
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AICaddie:
    type: application
    platform: iOS
    sources:
      - path: mobile/ios/AICaddie
        excludes:
          - Info.plist
    dependencies:
      - target: AICaddieWatch
    info:
      path: AICaddie/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile
        INFOPLIST_FILE: $(PROJECT_DIR)/AICaddie/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 6HB84897DJ
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.ai-caddie.mobile

  AICaddieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: mobile/ios/AICaddieTests
    dependencies:
      - target: AICaddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

  AICaddieWatch:
    type: application
    platform: watchOS
    sources:
      - path: mobile/ios/AICaddieWatch
        excludes:
          - Info.plist
    info:
      path: AICaddieWatch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.watchkitapp
        INFOPLIST_FILE: $(PROJECT_DIR)/AICaddieWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 6HB84897DJ
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.ai-caddie.mobile.watchkitapp

  AICaddieWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: mobile/ios/AICaddieWatchTests
    dependencies:
      - target: AICaddieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AICaddie:
    build:
      targets:
        AICaddie: all
        AICaddieWatch: all
        AICaddieTests: [test]
    test:
      targets:
        - AICaddieTests

  AICaddieWatch:
    build:
      targets:
        AICaddieWatch: all
        AICaddieWatchTests: [test]
    test:
      targets:
        - AICaddieWatchTests

name: AICaddieNative

options:
  bundleIdPrefix: com.ai-caddie
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SwiftJCS:
    type: library.static
    platform: auto
    supportedDestinations:
      - iOS
      - watchOS
    sources:
      - path: mobile/ios/AICaddieDomain/ThirdParty/SwiftJCS

  AICaddieDomain:
    type: framework
    platform: auto
    supportedDestinations:
      - iOS
      - watchOS
    sources:
      - path: mobile/ios/AICaddieDomain
        excludes:
          - ThirdParty/SwiftJCS
    dependencies:
      - target: SwiftJCS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.domain
        GENERATE_INFOPLIST_FILE: YES

  AICaddieDomainTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - watchOS
    sources:
      - path: mobile/ios/AICaddieDomainTests
        excludes:
          - Fixtures
      - path: mobile/ios/AICaddieDomainTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AICaddieDomain
      - target: SwiftJCS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.domain.tests
        GENERATE_INFOPLIST_FILE: YES

  AICaddie:
    type: application
    platform: iOS
    sources:
      - path: mobile/ios/AICaddie
        excludes:
          - Info.plist
    dependencies:
      - target: AICaddieDomain
      - target: AICaddieWatch
    info:
      path: AICaddie/Info.plist
    entitlements:
      path: AICaddie/AICaddie.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile
        INFOPLIST_FILE: $(PROJECT_DIR)/AICaddie/Info.plist
        AI_CADDIE_API_BASE_URL: ""
        AI_CADDIE_ADMIN_TOKEN: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 6HB84897DJ
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.ai-caddie.mobile

  AICaddieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: mobile/ios/AICaddieTests
        excludes:
          - Fixtures
      - path: mobile/ios/AICaddieTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AICaddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

  AICaddieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: mobile/ios/AICaddieUITests
    dependencies:
      - target: AICaddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AICaddie

  AICaddieWatch:
    type: application
    platform: watchOS
    sources:
      - path: mobile/ios/AICaddieWatch
        excludes:
          - Info.plist
    dependencies:
      - target: AICaddieDomain
    info:
      path: AICaddieWatch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.watchkitapp
        INFOPLIST_FILE: $(PROJECT_DIR)/AICaddieWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 6HB84897DJ
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.ai-caddie.mobile.watchkitapp

  AICaddieWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: mobile/ios/AICaddieWatchTests
    dependencies:
      - target: AICaddieWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai-caddie.mobile.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AICaddie:
    build:
      targets:
        AICaddie: all
        AICaddieWatch: all
        AICaddieDomainTests: [test]
        AICaddieTests: [test]
    test:
      targets:
        - AICaddieDomainTests
        - AICaddieTests

  AICaddieUITests:
    build:
      targets:
        AICaddie: all
        AICaddieWatch: all
        AICaddieUITests: [test]
    test:
      targets:
        - AICaddieUITests

  AICaddieWatch:
    build:
      targets:
        AICaddieWatch: all
        AICaddieWatchTests: [test]
    test:
      targets:
        - AICaddieWatchTests

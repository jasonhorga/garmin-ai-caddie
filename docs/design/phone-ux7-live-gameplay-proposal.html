      width: 20px;

      border: 1px solid rgba(246, 251, 244, .5);
      border-radius: 50%;
      font-size: 10px;
    }
    #phone-ux7-gameplay-proposal .golf-shot-chain button strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 500; }
    #phone-ux7-gameplay-proposal .golf-shot-chain button small { color: rgba(246, 251, 244, .62); font-size: 10px; }
    #phone-ux7-gameplay-proposal .golf-hazard-switcher { border-bottom: 1px solid rgba(246, 251, 244, .18); }
    #phone-ux7-gameplay-proposal .golf-actions {
      display: grid;
      grid-template-columns: 1fr 1.12fr 1fr;
      align-items: end;
      gap: 12px;
      padding-top: 2px;
    }
    #phone-ux7-gameplay-proposal .golf-actions button {
      min-height: 52px;
      display: grid;
      place-items: center;
      gap: 3px;
      padding: 7px;
      border: 0;
      border-radius: 50%;
    }
    #phone-ux7-gameplay-proposal .golf-actions button span { font-size: 10px; }
    #phone-ux7-gameplay-proposal .golf-action-secondary { background: rgba(9, 22, 13, .76); backdrop-filter: blur(10px); }
    #phone-ux7-gameplay-proposal .golf-action-primary {
      width: 66px;
      height: 66px;
      justify-self: center;
      background: #d9ff4f;
      color: #102816;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .35);
    }
    #phone-ux7-gameplay-proposal .golf-action-primary svg { width: 22px; height: 22px; }
    @media (max-width: 370px) {
      #phone-ux7-gameplay-proposal .golf-phone { border-radius: 0; }
      #phone-ux7-gameplay-proposal .golf-topbar { inset-inline: 8px; }
      #phone-ux7-gameplay-proposal .golf-bottom-hud { inset-inline: 8px; bottom: 10px; }
      #phone-ux7-gameplay-proposal .golf-shot-chain button { padding-inline: 4px; }
      #phone-ux7-gameplay-proposal .golf-hole-title strong { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #phone-ux7-gameplay-proposal .golf-route,
      #phone-ux7-gameplay-proposal .golf-hazard { transition: none; }
    }
  </style>

  <script>
    (() => {
      const root = document.getElementById('phone-ux7-gameplay-proposal');
      if (!root) return;
      const routes = [
        {
          id: 'stock',
          name: '稳定三杆攻岭',
          shots: [
            ['一号木', '224 码'],
            ['三号木', '193 码'],
            ['七号铁', '93 码']
          ]
        },
        {
          id: 'control',
          name: '避开右侧水障碍',
          shots: [
            ['三号木', '205 码'],
            ['五号铁', '169 码'],
            ['九号铁', '136 码']
          ]
        }
      ];
      const hazards = [
        { id: 'green-bunker', name: '果岭右沙坑', front: 451, back: 468 },
        { id: 'water', name: '果岭右侧水障碍', front: 472, back: 506 },
        { id: 'fairway-bunker', name: '球道右沙坑', front: 248, back: 269 }
      ];
      let routeIndex = 0;
      let hazardIndex = 0;

      function renderRoute() {
        const route = routes[routeIndex];
        root.querySelectorAll('[data-route-line]').forEach((line) => {
          line.classList.toggle('is-active', line.dataset.routeLine === route.id);
        });
        root.querySelector('[data-route-count]').textContent = `${routeIndex + 1} / ${routes.length}`;
        root.querySelector('[data-route-name]').textContent = route.name;
        const chain = root.querySelector('[data-shot-chain]');
        chain.replaceChildren();
        route.shots.forEach((shot, index) => {
          if (index > 0) {
            const arrow = document.createElement('i');
            arrow.dataset.lucide = 'chevron-right';
            arrow.setAttribute('aria-hidden', 'true');
            chain.appendChild(arrow);
          }
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-pressed', index === 0 ? 'true' : 'false');
          button.setAttribute('aria-label', `第 ${index + 1} 杆，${shot[0]}，${shot[1]}`);
          button.innerHTML = `<span>${index + 1}</span><strong>${shot[0]}</strong><small>${shot[1]}</small>`;
          button.addEventListener('click', () => {
            chain.querySelectorAll('button').forEach((item) => item.setAttribute('aria-pressed', 'false'));
            button.setAttribute('aria-pressed', 'true');
          });
          chain.appendChild(button);
        });
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function renderHazard() {
        const hazard = hazards[hazardIndex];
        root.querySelectorAll('[data-hazard-shape]').forEach((shape) => {
          shape.classList.toggle('is-active', shape.dataset.hazardShape === hazard.id);
        });
        root.querySelector('[data-hazard-count]').textContent = `${hazardIndex + 1} / ${hazards.length}`;
        root.querySelector('[data-hazard-name]').textContent = hazard.name;
        root.querySelector('[data-hazard-front]').textContent = hazard.front;
        root.querySelector('[data-hazard-back]').textContent = hazard.back;
        root.querySelector('[data-hazard-summary]').textContent = `${hazard.name} · 到 ${hazard.front} / 过 ${hazard.back} 码`;
      }

      root.querySelector('[data-route-prev]').addEventListener('click', () => {
        routeIndex = (routeIndex - 1 + routes.length) % routes.length;
        renderRoute();
      });
      root.querySelector('[data-route-next]').addEventListener('click', () => {
        routeIndex = (routeIndex + 1) % routes.length;
        renderRoute();
      });
      root.querySelector('[data-hazard-prev]').addEventListener('click', () => {
        hazardIndex = (hazardIndex - 1 + hazards.length) % hazards.length;
        renderHazard();
      });
      root.querySelector('[data-hazard-next]').addEventListener('click', () => {
        hazardIndex = (hazardIndex + 1) % hazards.length;
        renderHazard();
      });
    })();
  </script>
</div>

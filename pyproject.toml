[project]
name = "garmin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.100.0",
    "browser-cookie3>=0.20.1",
    "fastapi>=0.136.3",
    "garminconnect>=0.3.3",
    "garth>=0.8.0",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "matplotlib>=3.10.9",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
# Auth self-heal: headed Chromium under xvfb (garmin_playwright_login). Not a
# runtime dependency of the API — install with `uv run --group auth` / `uv sync --group auth`.
auth = ["playwright>=1.60"]

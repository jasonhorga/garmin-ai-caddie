name: Native Mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'Package.swift'
      - 'ops/write_native_build_evidence.py'
      - '.github/workflows/native-mobile.yml'

concurrency:
  group: ai-caddie-native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mobile:
    runs-on: macos-15
    env:
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
      WATCH_DESTINATION: platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native project
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .
      - name: Show simulator inventory
        run: xcrun simctl list devices available
      - name: Test iOS app target
        run: |
          xcodebuild test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddie \
            -destination "$IOS_DESTINATION"
      - name: Verify SwiftJCS consumer boundaries
        if: always()
        run: |
          set -euo pipefail

          PACKAGE_CONSUMER="$RUNNER_TEMP/swift-package-consumer"
          mkdir -p \
            "$PACKAGE_CONSUMER/Sources/PositiveConsumer" \
            "$PACKAGE_CONSUMER/Sources/ExplicitSwiftJCSConsumer"
          cat > "$PACKAGE_CONSUMER/Package.swift" <<SWIFT
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "ExternalAICaddieConsumer",
              platforms: [.iOS(.v17)],
              dependencies: [
                  .package(name: "AICaddieSource", path: "$GITHUB_WORKSPACE"),
              ],
              targets: [
                  .executableTarget(
                      name: "PositiveConsumer",
                      dependencies: [
                          .product(
                              name: "AICaddieDomain",
                              package: "AICaddieSource"
                          ),
                      ]
                  ),
                  .executableTarget(
                      name: "ExplicitSwiftJCSConsumer",
                      dependencies: [
                          .product(
                              name: "AICaddieDomain",
                              package: "AICaddieSource"
                          ),
                      ]
                  ),
              ]
          )
          SWIFT
          cat > "$PACKAGE_CONSUMER/Sources/PositiveConsumer/main.swift" <<'SWIFT'
          import AICaddieDomain
          let value = JSONValue.null
          _ = try CanonicalJSON.data(value)
          _ = try TypedID.make(domain: "VisibilityProbe/v1", value: value)
          SWIFT
          cat > "$PACKAGE_CONSUMER/Sources/ExplicitSwiftJCSConsumer/main.swift" <<'SWIFT'
          import Foundation
          import SwiftJCS
          _ = try JSONCanonicalization.data(
              withJSONObject: NSNumber(value: -0.0)
          )
          SWIFT
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          swift build \
            --package-path "$PACKAGE_CONSUMER" \
            --triple "$ARCH-apple-ios17.0-simulator" \
            --sdk "$SDK" \
            --target PositiveConsumer
          set +e
          SWIFTPM_DIAGNOSTIC=$(swift build \
            --package-path "$PACKAGE_CONSUMER" \
            --triple "$ARCH-apple-ios17.0-simulator" \
            --sdk "$SDK" \
            --target ExplicitSwiftJCSConsumer 2>&1)
          SWIFTPM_STATUS=$?
          set -e
          printf '%s\n' "$SWIFTPM_DIAGNOSTIC"
          BOUNDARY_FAILURES=0
          if [ "$SWIFTPM_STATUS" -eq 0 ]; then
            echo "::error::External SwiftPM product consumer imported SwiftJCS"
            BOUNDARY_FAILURES=$((BOUNDARY_FAILURES + 1))
          elif ! grep -F "no such module 'SwiftJCS'" \
            <<< "$SWIFTPM_DIAGNOSTIC"; then
            echo "::error::SwiftPM negative consumer failed for an unexpected reason"
            BOUNDARY_FAILURES=$((BOUNDARY_FAILURES + 1))
          fi

          DOMAIN_FRAMEWORK=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -path '*/Build/Products/Debug-iphonesimulator/AICaddieDomain.framework' \
            -print -quit)
          test -n "$DOMAIN_FRAMEWORK"
          FRAMEWORK_ARTIFACT="$RUNNER_TEMP/aicaddie-domain-artifact"
          mkdir -p "$FRAMEWORK_ARTIFACT"
          ditto \
            "$DOMAIN_FRAMEWORK" \
            "$FRAMEWORK_ARTIFACT/AICaddieDomain.framework"
          test ! -e "$FRAMEWORK_ARTIFACT/SwiftJCS.swiftmodule"
          test ! -e "$FRAMEWORK_ARTIFACT/libSwiftJCS.a"
          POSITIVE_CONSUMER="$RUNNER_TEMP/AICaddieDomainPositiveConsumer.swift"
          cat > "$POSITIVE_CONSUMER" <<'SWIFT'
          import AICaddieDomain
          func verifyPublicWrapper() throws {
              let value = JSONValue.null
              _ = try CanonicalJSON.data(value)
              _ = try TypedID.make(domain: "VisibilityProbe/v1", value: value)
          }
          SWIFT
          CONSUMER="$RUNNER_TEMP/AICaddieDomainConsumer.swift"
          cat > "$CONSUMER" <<'SWIFT'
          import SwiftJCS
          _ = try JSONCanonicalization.data(
              withJSONObject: ["unchecked": -0.0]
          )
          SWIFT
          set +e
          FRAMEWORK_POSITIVE_DIAGNOSTIC=$(xcrun swiftc -typecheck \
            -target "$ARCH-apple-ios17.0-simulator" \
            -sdk "$SDK" \
            -F "$FRAMEWORK_ARTIFACT" \
            "$POSITIVE_CONSUMER" 2>&1)
          FRAMEWORK_POSITIVE_STATUS=$?
          FRAMEWORK_DIAGNOSTIC=$(xcrun swiftc -typecheck \
            -target "$ARCH-apple-ios17.0-simulator" \
            -sdk "$SDK" \
            -F "$FRAMEWORK_ARTIFACT" \
            "$CONSUMER" 2>&1)
          FRAMEWORK_STATUS=$?
          set -e
          printf '%s\n' "$FRAMEWORK_POSITIVE_DIAGNOSTIC"
          printf '%s\n' "$FRAMEWORK_DIAGNOSTIC"
          if [ "$FRAMEWORK_POSITIVE_STATUS" -ne 0 ]; then
            echo "::error::Isolated AICaddieDomain framework consumer could not use wrapper"
            BOUNDARY_FAILURES=$((BOUNDARY_FAILURES + 1))
          fi
          if [ "$FRAMEWORK_STATUS" -eq 0 ]; then
            echo "::error::Isolated framework consumer imported SwiftJCS"
            BOUNDARY_FAILURES=$((BOUNDARY_FAILURES + 1))
          elif ! grep -F "no such module 'SwiftJCS'" \
            <<< "$FRAMEWORK_DIAGNOSTIC"; then
            echo "::error::Framework negative consumer failed for an unexpected reason"
            BOUNDARY_FAILURES=$((BOUNDARY_FAILURES + 1))
          fi
          test "$BOUNDARY_FAILURES" -eq 0
      - name: Collect design snapshots
        if: always()
        run: |
          mkdir -p design-snapshots
          find ~/Library/Developer/CoreSimulator -path "*Documents/design-snapshots/*.png" -exec cp {} design-snapshots/ \; 2>/dev/null || true
          ls -la design-snapshots || true
      - name: Upload design snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-snapshots
          path: design-snapshots/
          if-no-files-found: warn
      - name: Real-simulator screenshots (iOS, XCUITest against live backend)
        # On-demand only (XCUITest + live-funnel + watch simctl add ~10min) — trigger with
        # `gh workflow run native-mobile.yml --ref <branch>`; regular PRs stay fast.
        if: github.event_name == 'workflow_dispatch'
        env:
          # TEST_RUNNER_-prefixed vars are forwarded by xcodebuild into the UI-test runner environment
          # (the plain forms are a fallback in case they propagate too). The test reads both.
          TEST_RUNNER_AI_CADDIE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          TEST_RUNNER_AI_CADDIE_ADMIN_TOKEN: ${{ secrets.AI_CADDIE_ADMIN_TOKEN }}
          TEST_RUNNER_UITEST_GPS_LAT: '40.083'
          TEST_RUNNER_UITEST_GPS_LON: '116.585'
          AI_CADDIE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          AI_CADDIE_ADMIN_TOKEN: ${{ secrets.AI_CADDIE_ADMIN_TOKEN }}
          UITEST_GPS_LAT: '40.083'
          UITEST_GPS_LON: '116.585'
        run: |
          set -x
          # Launches the REAL app in the simulator (not ImageRenderer) pointed at the funnel with the
          # owner token + a simulated GPS fix, navigates, and captures real screens AND a screen-recorded
          # video. Resolve + boot the exact iPhone 16 sim by UDID so simctl can record it while XCUITest
          # drives the app on the same instance. `|| true` so screenshots/video artifacts always collect.
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "iOS sim UDID: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" || true
          mkdir -p real-videos
          # Record the simulator screen for the whole XCUITest run (background; SIGINT finalizes the mp4).
          ( xcrun simctl io "$UDID" recordVideo --codec h264 --force real-videos/real-flow.mp4 ) &
          REC_PID=$!
          sleep 2
          # -parallel-testing-enabled NO stops Xcode cloning the sim for UI tests, so the app runs on
          # the SAME booted sim we're screen-recording (a clone would leave the recording on home screen).
          xcodebuild test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieUITests \
            -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO || true
          kill -INT "$REC_PID" 2>/dev/null || true
          sleep 4
          ls -la real-videos || true
      - name: Collect real screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p real-screenshots
          find ~/Library/Developer/CoreSimulator -path "*Documents/real-screenshots/*" -exec cp {} real-screenshots/ \; 2>/dev/null || true
          ls -la real-screenshots || true
      - name: Upload real screenshots
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: real-screenshots
          path: real-screenshots/
          if-no-files-found: warn
      - name: Upload real video
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: real-video
          path: real-videos/
          if-no-files-found: warn
      - name: Test Watch app target
        run: |
          xcodebuild test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieWatch \
            -destination "$WATCH_DESTINATION"
      - name: Collect Watch design snapshots
        if: always()
        run: |
          mkdir -p watch-snapshots
          find ~/Library/Developer/CoreSimulator -path "*Documents/watch-snapshots/*.png" -exec cp {} watch-snapshots/ \; 2>/dev/null || true
          ls -la watch-snapshots || true
      - name: Upload Watch design snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-snapshots
          path: watch-snapshots/
          if-no-files-found: warn
      - name: Real-simulator screenshots (watchOS via simctl — no XCUITest on watchOS)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -x
          WATCH_UDID=$(xcrun simctl list devices available | grep "Apple Watch Series 10 (46mm)" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "watch udid: $WATCH_UDID"
          [ -z "$WATCH_UDID" ] && { echo "no watch sim"; exit 0; }
          xcrun simctl boot "$WATCH_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$WATCH_UDID" || true
          # Install the Debug watch build (test already built it; install is idempotent + robust).
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "AICaddieWatch.app" -path "*Debug-watchsimulator*" 2>/dev/null | head -1)
          echo "watch app: $APP"
          [ -n "$APP" ] && xcrun simctl install "$WATCH_UDID" "$APP" || true
          BID=com.ai-caddie.mobile.watchkitapp
          mkdir -p watch-real-screenshots
          for screen in home caddie-options hazards glance scorecard hole-select menu score finish start; do
            xcrun simctl terminate "$WATCH_UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$WATCH_UDID" "$BID" -uitest-screen "$screen" 2>/dev/null || true
            sleep 4
            xcrun simctl io "$WATCH_UDID" screenshot "watch-real-screenshots/watch-$screen.png" 2>/dev/null || true
          done
          ls -la watch-real-screenshots || true
      - name: Upload watch real screenshots
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: watch-real-screenshots
          path: watch-real-screenshots/
          if-no-files-found: warn
      - name: Write native build evidence
        run: python3 ops/write_native_build_evidence.py
      - name: Upload native build evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-build-evidence
          path: mobile/ios/native_build_evidence.json

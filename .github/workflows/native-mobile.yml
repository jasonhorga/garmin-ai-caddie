        run: python3 .github/scripts/preflight_live_course_catalogue.py
      - &real_simulator_screenshots_ios_xcuitest_against_live_backend
        name: Real-simulator screenshots (iOS, XCUITest against live backend)
        id: real_ios_capture
        if: ${{ (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')) }}
        # Leave fixture runners time to scan/upload diagnostics before their job cap.
        timeout-minutes: ${{ inputs.fixture_mode && (env.NATIVE_CAPTURE_SHARD == 'real-flow' && 45 || 35) || 90 }}
        env:
          # TEST_RUNNER_-prefixed vars are forwarded by xcodebuild into the UI-test runner environment
          # (the plain forms are a fallback in case they propagate too). The test reads both.
          TEST_RUNNER_AI_CADDIE_API_BASE_URL: ${{ inputs.fixture_mode && 'http://127.0.0.1:9000' || github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          TEST_RUNNER_AI_CADDIE_FIXTURE_MODE: ${{ inputs.fixture_mode && '1' || '0' }}
          TEST_RUNNER_AI_CADDIE_DATA_MODE: ${{ inputs.fixture_mode && 'fixture' || '' }}
          TEST_RUNNER_UITEST_CAPTURE_SCOPE: ${{ github.event.inputs.capture_scope || 'full' }}
          TEST_RUNNER_UITEST_REVIEW_ROUND_REF: ${{ github.event.inputs.review_round_ref || '' }}
          # 北京丽宫第 1 洞蓝 T (from the decoded CourseView hole anchor + tee coordinates).
          TEST_RUNNER_UITEST_GPS_LAT: '40.0454995'
          TEST_RUNNER_UITEST_GPS_LON: '116.5461531'
          AI_CADDIE_API_BASE_URL: ${{ inputs.fixture_mode && 'http://127.0.0.1:9000' || github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          AI_CADDIE_FIXTURE_MODE: ${{ inputs.fixture_mode && '1' || '0' }}
          AI_CADDIE_DATA_MODE: ${{ inputs.fixture_mode && 'fixture' || '' }}
          UITEST_CAPTURE_SCOPE: ${{ github.event.inputs.capture_scope || 'full' }}
          UITEST_REVIEW_ROUND_REF: ${{ github.event.inputs.review_round_ref || '' }}
          UITEST_GPS_LAT: '40.0454995'
          UITEST_GPS_LON: '116.5461531'
          RETRY_DELAY_SECONDS: '60'
          RETRY_MAX_ATTEMPTS: '6'
        run: |
          set -x
          # Launches the REAL app in the simulator (not ImageRenderer) pointed at the funnel with the
          # owner token + a simulated GPS fix, navigates, and captures real screens AND a screen-recorded
          # video. Resolve + boot the exact iPhone 16 sim by UDID so simctl can record it while XCUITest
          # drives the app on the same instance. `|| true` so screenshots/video artifacts always collect.
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "iOS sim UDID: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" || true
          # One TeeSelection journey intentionally bypasses UITEST_GPS_* and exercises the actual
          # Core Location permission callback + simulator location delivery. Keep TCC clean so the
          # test proves the notDetermined -> authorizedWhenInUse transition on every fresh runner.
          xcrun simctl privacy "$UDID" reset location com.ai-caddie.mobile
          xcrun simctl location "$UDID" set 40.0454995,116.5461531
          mkdir -p real-videos
          # Record the simulator screen for the whole XCUITest run (background; SIGINT finalizes the mp4).
          ( xcrun simctl io "$UDID" recordVideo --codec h264 --force real-videos/real-flow.mp4 ) &
          REC_PID=$!
          sleep 2
          # -parallel-testing-enabled NO stops Xcode cloning the sim for UI tests, so the app runs on
          # the SAME booted sim we're screen-recording (a clone would leave the recording on home screen).
          set +e
          ONLY_TESTING=()
          case "$UITEST_CAPTURE_SCOPE" in
            review)
              ONLY_TESTING=(
                -only-testing:AICaddieUITests/RealFlowUITests/testCaptureRealAppFlow
                -only-testing:AICaddieUITests/RealFlowUITests/testWholeCourseBackNineStartsFromFirstStrokeJourney
                -only-testing:AICaddieUITests/ReviewEditUITests/testCaptureReviewEditFlow
                -only-testing:AICaddieUITests/TeeSelectionUITests
                -only-testing:AICaddieUITests/PrepDegradationUITests
              )
              ;;
            edit)
              ONLY_TESTING=(
                -only-testing:AICaddieUITests/ReviewEditUITests/testCaptureReviewEditFlow
              )
              ;;
            *)

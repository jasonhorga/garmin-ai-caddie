          launch_and_capture course-turn watch-course-turn.png
      - &scan_watch_runtime_screenshots_for_secret_bytes
        name: Scan Watch runtime screenshots for secret bytes
        id: scan_watch_real_screenshots
        if: ${{ always() && github.event.inputs.capture_scope == 'full' && steps.capture_watch_real_screenshots.outcome == 'success' && (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')) }}
        run: python3 .github/scripts/scan_artifacts_for_secrets.py --secret-env ARTIFACT_ADMIN_TOKEN watch-real-screenshots
      - &upload_watch_real_screenshots
        name: Upload watch real screenshots
        if: ${{ always() && github.event.inputs.capture_scope == 'full' && steps.capture_watch_real_screenshots.outcome == 'success' && steps.scan_watch_real_screenshots.outcome == 'success' && (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')) }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: watch-real-screenshots
          path: watch-real-screenshots/

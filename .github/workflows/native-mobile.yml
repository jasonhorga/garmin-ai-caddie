  # C16e ProductPhoneUITests on its own runner. ProductFixtureServer binds the only fixture origin the
  # DEBUG app accepts (loopback port 9000, BackendConfigurationStore.normalizedAPIBaseURL), which
  # the job above gives to the Python fixture in fixture_mode. No Python fixture and no secrets here:
  # the tests launch the app with synthetic credentials against the in-process server.
  native-product-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.capture_scope != 'edit' }}
    runs-on: macos-15
    # "Test iOS app target" (build + unit tests) took 12 min on run 40187234659. This scheme also
    # builds the UI-test bundle and then runs 13 serial tests with about 20 app launches, so about
    # 25 min is expected; 45 stops a hung simulator at roughly twice that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native project
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .
      - name: Show simulator inventory
        run: xcrun simctl list devices available
      - name: Check Product UI fixture port is free
        run: |
          if lsof -nP -iTCP:9000 -sTCP:LISTEN; then
            echo "::error::port 9000 is already listening; ProductFixtureServer needs it"
            exit 1
          fi
      - name: Resolve and boot iOS UI-test simulator
        run: |
          set -eu
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          test -n "$UDID"
          echo "iOS sim UDID: $UDID"
          echo "PRODUCT_UI_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Test Product UI tests
        id: product_ui_tests
        timeout-minutes: 35
        run: |
          mkdir -p product-ui-results
          # Serial on the booted simulator: the class shares one app and one backend (Product/README.md).
          # No transient-retry wrapper: the backend is local and synthetic, so a retry would only hide flakes.
          set +e
          set -o pipefail
          xcodebuild test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieUITests \
            -destination "platform=iOS Simulator,id=$PRODUCT_UI_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath product-ui-results/ProductPhoneUITests.xcresult \
            -only-testing:AICaddieUITests/ProductPhoneUITests \
            2>&1 | tee product-ui-results/xcodebuild.log
          TEST_STATUS=$?
          set -e
          if [ "$TEST_STATUS" -ne 0 ] && [ -d product-ui-results/ProductPhoneUITests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path product-ui-results/ProductPhoneUITests.xcresult --compact 2>/dev/null \
              | python3 -c 'import json, sys
          for f in json.load(sys.stdin).get("testFailures", []):
              name = f.get("testIdentifierString") or f.get("testName") or "UI test"
              text = " ".join(str(f.get("failureText", "")).split())[:900]
              print(f"::error title=UI test failure::{name} :: {text}")' || true
          fi
          exit "$TEST_STATUS"
      - name: Verify every Product UI test ran
        if: ${{ always() && steps.product_ui_tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          # A mistyped -only-testing filter makes xcodebuild run zero tests and still succeed.
          EXPECTED=$(grep -cE '^[[:space:]]*func test_' mobile/ios/AICaddieUITests/Product/ProductPhoneUITests.swift)
          RESULT=product-ui-results/ProductPhoneUITests.xcresult
          test -d "$RESULT"
          xcrun xcresulttool get test-results tests --path "$RESULT" --compact > product-ui-results/tests.json
          xcrun xcresulttool get test-results summary --path "$RESULT" --compact > product-ui-results/summary.json
          python3 - "$EXPECTED" <<'PY'
          import json
          import sys

          expected = int(sys.argv[1])
          with open("product-ui-results/tests.json", encoding="utf-8") as handle:
              tree = json.load(handle)
          with open("product-ui-results/summary.json", encoding="utf-8") as handle:
              summary = json.load(handle)

          def cases(nodes):
              for node in nodes:
                  if node.get("nodeType") == "Test Case":
                      yield node
                  yield from cases(node.get("children", []))

          ran = [node for node in cases(tree.get("testNodes", []))
                 if "ProductPhoneUITests" in str(node.get("nodeIdentifier", ""))]
          for node in ran:
              print(f"{node.get('nodeIdentifier')}: {node.get('result')}")
          print(
              f"ProductPhoneUITests ran {len(ran)}/{expected}: "
              f"passed={summary.get('passedTests')} expectedFailures={summary.get('expectedFailures')} "
              f"failed={summary.get('failedTests')} skipped={summary.get('skippedTests')}"
          )
          if expected == 0 or len(ran) != expected or summary.get("skippedTests"):
              raise SystemExit("ProductPhoneUITests did not run every test method")
          PY
      - name: J4.2 fixture DNS gate (Product UI tests)
        if: ${{ always() && steps.product_ui_tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          test -f product-ui-results/xcodebuild.log || {
            echo 'J4.2 Product UI DNS gate: xcodebuild log is missing' >&2
            exit 1
          }
          python3 .github/scripts/check_native_fixture_dns.py product-ui-results/xcodebuild.log
      - name: Collect Product UI failure screenshots
        if: ${{ failure() }}
        run: |
          mkdir -p product-ui-screenshots
          if [ -d product-ui-results/ProductPhoneUITests.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path product-ui-results/ProductPhoneUITests.xcresult \
              --output-path product-ui-screenshots || true
          fi
          ls -la product-ui-screenshots || true
      - name: Upload Product UI xcresult
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: product-ui-xcresult
          path: product-ui-results/
          if-no-files-found: warn
      - name: Upload Product UI screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: product-ui-screenshots
          path: product-ui-screenshots/
          if-no-files-found: warn

  # Keep the public job conclusion and artifact names consumed by the project console.
  # This runner only combines already secret-scanned evidence; it never starts a simulator.
  native-mobile:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [native-live, native-unit-watch, native-real-flow, native-screenshots, native-product-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify native job conclusions
        if: always()
        env:
          NATIVE_NEEDS: ${{ toJSON(needs) }}
          FIXTURE_MODE: ${{ inputs.fixture_mode }}
          CAPTURE_SCOPE: ${{ inputs.capture_scope }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ['NATIVE_NEEDS'])
          fixture = os.environ['FIXTURE_MODE'] == 'true'
          edit = os.environ['CAPTURE_SCOPE'] == 'edit'
          expected = ['native-screenshots'] if fixture else ['native-live']
          if fixture and not edit:
              expected += ['native-product-ui', 'native-unit-watch', 'native-real-flow']
          failures = {name: jobs[name]['result'] for name in expected
                      if jobs[name]['result'] != 'success'}
          print('Required native job conclusions:', {name: jobs[name]['result'] for name in expected})
          if failures:
              raise SystemExit(f'Native validation did not pass: {failures}')
          PY
      - name: Download fixture shard evidence
        if: ${{ always() && inputs.fixture_mode }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: native-shards
          pattern: "@(real-screenshots|real-video|fixture-startup-diagnostics|native-build-evidence-ci-fixture)-@(unit-watch|real-flow|screenshots)"
      - name: Combine fixture evidence under the legacy contract
        id: combine_fixture_evidence
        if: ${{ always() && inputs.fixture_mode }}
        env:
          NATIVE_NEEDS: ${{ toJSON(needs) }}
          CAPTURE_SCOPE: ${{ inputs.capture_scope }}
        run: |
          python3 - <<'PY'
          import filecmp
          import json
          import os
          from pathlib import Path
          import shutil

          root = Path('native-shards')
          jobs = json.loads(os.environ['NATIVE_NEEDS'])
          edit = os.environ['CAPTURE_SCOPE'] == 'edit'
          shards = ['screenshots'] if edit else ['real-flow', 'screenshots']
          # Successful runners must have published both scanned capture artifacts.
          for shard in shards:
              if jobs[f'native-{shard}']['result'] == 'success':
                  for artifact in ('real-screenshots', 'real-video'):
                      if not (root / f'{artifact}-{shard}').is_dir():
                          raise SystemExit(f'Missing {artifact}-{shard} from a successful runner')

          outputs = []
          for artifact, suffixes, log_name in (
              ('real-screenshots', shards, 'ios-app.log'),
              ('real-video', shards, None),
              ('fixture-startup-diagnostics', ['unit-watch', *shards], 'stderr.log'),
          ):
              destination = Path(artifact)
              files = {}
              for shard in suffixes:
                  source = root / f'{artifact}-{shard}'
                  if not source.is_dir():
                      continue
                  for path in sorted(source.rglob('*')):
                      if path.is_file():
                          files.setdefault(path.relative_to(source), []).append((shard, path))
              for relative, entries in files.items():
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if str(relative) == log_name:
                      logs = [f'=== {shard} ===\n' + path.read_text(errors='replace')
                              for shard, path in entries]
                      target.write_text('\n'.join(logs), encoding='utf-8')
                      if len(entries) > 1:
                          for shard, path in entries:
                              original = destination / 'shards' / shard / relative
                              original.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(path, original)
                  else:
                      # Store each unique capture once; retain differing basename conflicts.
                      shutil.copy2(entries[0][1], target)
                      seen = [entries[0][1]]
                      for shard, path in entries[1:]:
                          if not any(filecmp.cmp(path, previous, shallow=False) for previous in seen):
                              conflict = destination / 'shards' / shard / relative
                              conflict.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(path, conflict)
                              seen.append(path)
              if destination.is_dir():
                  outputs.append(f'{artifact}=true')

          stamp = root / 'native-build-evidence-ci-fixture-unit-watch' / 'native_build_evidence.json'
          if not edit and jobs['native-unit-watch']['result'] == 'success' and not stamp.is_file():
              raise SystemExit('Missing native build evidence from the unit runner')
          if not edit and stamp.is_file():
              evidence = json.loads(stamp.read_text())
              if evidence['ios']['status'] == 'passed':
                  results = [jobs[f'native-{shard}']['result'] for shard in shards]
                  evidence['ios']['status'] = ('passed' if all(r == 'success' for r in results)
                                               else 'failed' if 'failure' in results else 'skipped')
              output = Path('native-build-evidence-ci-fixture/native_build_evidence.json')
              output.parent.mkdir(exist_ok=True)
              output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
              outputs.append('native-build-evidence-ci-fixture=true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('\n'.join(outputs) + '\n')
          PY
      - name: Upload combined real screenshots
        if: ${{ always() && steps.combine_fixture_evidence.outputs.real-screenshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: real-screenshots
          path: real-screenshots/
          if-no-files-found: error
      - name: Upload combined real video
        if: ${{ always() && steps.combine_fixture_evidence.outputs.real-video == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: real-video
          path: real-video/
          if-no-files-found: error
      - name: Upload combined fixture startup diagnostics

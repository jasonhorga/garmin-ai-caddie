        if: ${{ always() && github.event.inputs.capture_scope == 'full' && (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')) }}
        run: |
          set -euo pipefail
          WATCH_DEVICE=$(xcrun simctl list devices available -j | jq -c '
            [.devices | to_entries[]

name: Native Mobile CI

on:
  workflow_dispatch:
    inputs:
      capture_scope:
        description: Real-simulator evidence scope
        type: choice
        required: true
        default: full
        options:
          - full
          - review
          - edit
      fixture_mode:
        description: "Run native UI validation against the isolated CI fixture"
        required: false
        default: false
        type: boolean
      api_base_url:
        description: Optional public API origin for live simulator capture
        type: string
        required: false
        default: ''
      backend_revision:
        description: Expected deployed backend Git revision (40 hex characters); falls back to protected AI_CADDIE_BACKEND_REVISION
        type: string
        required: false
        default: ''
      review_round_ref:
        description: Optional exact Garmin round reference for deterministic review evidence
        type: string
        required: false
        default: ''
      require_live_preflight:
        description: Require the live API revision/catalogue gate before simulator capture
        type: boolean
        required: true
        default: true
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'Package.swift'
      - 'tests/product/fixtures/shared/**'
      - 'ops/write_native_build_evidence.py'
      - '.github/scripts/preflight_live_course_catalogue.py'
      - '.github/scripts/retry-transient-command.sh'
      - '.github/scripts/check_native_fixture_dns.py'
      - '.github/scripts/scan_artifacts_for_secrets.py'
      - '.github/scripts/test-retry-transient-command.sh'
      - '.github/workflows/native-mobile.yml'

concurrency:
  group: ai-caddie-native-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-quick:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25
    concurrency:
      group: native-quick-${{ github.head_ref }}
      cancel-in-progress: true
    env:
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Watch-related changes
        id: watch_changes
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --name-only "origin/$PR_BASE_REF"...HEAD > "$RUNNER_TEMP/native-quick-changed-paths.txt"
          # Watch targets, their shared domain/fixtures and the iPhone handoff bridge.
          if grep -Eq '^(mobile/ios/(AICaddieWatch[^/]*|AICaddieDomain|AICaddieDomainTests)/|mobile/ios/AICaddie/Services/Watch[^/]*\.swift$|mobile/ios/AICaddieTests/(Watch[^/]*\.swift|Product/ProductWatchHandoffTests\.swift)$|mobile/ios/project\.yml$|Package\.swift$|tests/product/fixtures/shared/)' "$RUNNER_TEMP/native-quick-changed-paths.txt"; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native project
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .
      - name: Build iOS tests while prebooting simulator
        id: quick_build
        run: |
          set -euo pipefail
          mkdir -p native-quick-results
          IOS_UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("SimRuntime.iOS-"))
              | .key as $runtime
              | .value[]
              | select(.isAvailable == true and .name == "iPhone 16")
              | {udid: .udid, version: ($runtime | split("-")[1:] | map(tonumber))}]
            | sort_by(.version) | last | .udid // empty')
          test -n "$IOS_UDID"
          echo "NATIVE_QUICK_IOS_UDID=$IOS_UDID" >> "$GITHUB_ENV"
          # Do not wait for boot/data migration until compilation has finished.
          xcrun simctl boot "$IOS_UDID" > native-quick-results/ios-boot.log 2>&1 &
          xcodebuild build-for-testing \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddie \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/NativeQuickDerivedData" \
            2>&1 | tee native-quick-results/ios-build-xcodebuild.log
      - name: Test iOS app target without rebuilding
        id: test_ios_app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$NATIVE_QUICK_IOS_UDID" -b \
            2>&1 | tee -a native-quick-results/ios-boot.log
          # Same complete AICaddie scheme as dispatch: Domain + App tests, including
          # DesignSnapshotTests assertions. Do not collect/export snapshot images.
          xcodebuild test-without-building \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddie \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -destination "platform=iOS Simulator,id=$NATIVE_QUICK_IOS_UDID" \
            -derivedDataPath "$RUNNER_TEMP/NativeQuickDerivedData" \
            -resultBundlePath native-quick-results/iOS.xcresult \
            2>&1 | tee native-quick-results/ios-test-xcodebuild.log
      - name: Check quick build products
        id: quick_products
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if compgen -G "$RUNNER_TEMP/NativeQuickDerivedData/Build/Products/*.xctestrun" > /dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Test Watch unit target when affected
        if: ${{ !cancelled() && steps.quick_build.outcome == 'success' && steps.watch_changes.outputs.needed == 'true' && steps.quick_products.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          WATCH_UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("SimRuntime.watchOS-"))
              | .key as $runtime
              | .value[]
              | select(.isAvailable == true and .name == "Apple Watch Series 10 (46mm)")
              | {udid: .udid, version: ($runtime | split("-")[1:] | map(tonumber))}]
            | sort_by(.version) | last | .udid // empty')
          test -n "$WATCH_UDID"
          xcrun simctl boot "$WATCH_UDID" > native-quick-results/watch-boot.log 2>&1 &
          xcodebuild test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieWatch \
            -only-testing:AICaddieWatchTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -destination "platform=watchOS Simulator,id=$WATCH_UDID" \
            -derivedDataPath "$RUNNER_TEMP/NativeQuickDerivedData" \
            -resultBundlePath native-quick-results/Watch.xcresult \
            2>&1 | tee native-quick-results/watch-test-xcodebuild.log
      - name: J4.2 fixture DNS gate (quick native tests)
        if: ${{ !cancelled() && steps.test_ios_app.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if ! test -f native-quick-results/ios-test-xcodebuild.log; then
            echo 'J4.2 native fixture DNS gate: iOS test log is missing' >&2
            exit 1
          fi
          logs=()
          for log in native-quick-results/ios-test-xcodebuild.log native-quick-results/watch-test-xcodebuild.log; do
            if [ -f "$log" ]; then
              logs+=("$log")
            fi
          done
          if [ "${#logs[@]}" -eq 0 ]; then
            echo 'J4.2 native fixture DNS gate: no fixture test logs were produced' >&2
            exit 1
          fi
          python3 .github/scripts/check_native_fixture_dns.py "${logs[@]}"
      - name: Upload quick failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: native-quick-failure-diagnostics
          path: native-quick-results/
          if-no-files-found: warn

  # Live dispatch retains serial execution; fixture runners reuse the same launch and scan gates.
  native-live:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.fixture_mode }}
    runs-on: macos-15
    # Live dispatch keeps the existing serial capture path.
    timeout-minutes: 150
    env:
      NATIVE_ARTIFACT_SUFFIX: ''
      NATIVE_CAPTURE_SHARD: all
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest
      WATCH_DESTINATION: platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=latest
    steps:
      - &actions_checkout_v4
        uses: actions/checkout@v4
      - &test_transient_command_retry_gate
        name: Test transient-command retry gate
        run: bash .github/scripts/test-retry-transient-command.sh
      - &install_xcodegen
        name: Install XcodeGen
        run: brew install xcodegen
      - &generate_native_project
        name: Generate native project
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .
      - &show_simulator_inventory
        name: Show simulator inventory
        run: xcrun simctl list devices available
      - &install_uv_for_isolated_ci_fixture
        name: Install uv for isolated CI fixture
        if: ${{ inputs.fixture_mode }}
        run: brew install uv
      - &start_isolated_ci_fixture
        name: Start isolated CI fixture
        id: start_fixture
        if: ${{ inputs.fixture_mode }}
        run: |
          set -euo pipefail
          command -v openssl >/dev/null 2>&1 || { echo "openssl is required for fixture token generation" >&2; exit 1; }
          FIXTURE_TOKEN="$(openssl rand -hex 32 2>/dev/null)" || { echo "fixture token generation failed" >&2; exit 1; }
          [[ "$FIXTURE_TOKEN" =~ ^[0-9a-f]{64}$ ]] || { echo "fixture token format validation failed" >&2; exit 1; }
          echo "::add-mask::$FIXTURE_TOKEN"
          export AI_CADDIE_ADMIN_TOKEN="$FIXTURE_TOKEN"
          {
            printf 'AI_CADDIE_ADMIN_TOKEN=%s\n' "$FIXTURE_TOKEN"
            printf 'AI_CADDIE_FIXTURE_MODE=1\n'
            printf 'AI_CADDIE_DATA_MODE=fixture\n'
            printf 'TEST_RUNNER_AI_CADDIE_ADMIN_TOKEN=%s\n' "$FIXTURE_TOKEN"
            printf 'TEST_RUNNER_AI_CADDIE_FIXTURE_MODE=1\n'
            printf 'TEST_RUNNER_AI_CADDIE_DATA_MODE=fixture\n'
            printf 'ARTIFACT_ADMIN_TOKEN=%s\n' "$FIXTURE_TOKEN"
            # XCTest can pass launchEnvironment to the runner, but the app launched by
            # simctl/XCTest receives simulator child variables. Keep one masked value for both.
            printf 'SIMCTL_CHILD_AI_CADDIE_ADMIN_TOKEN=%s\n' "$FIXTURE_TOKEN"
            printf 'SIMCTL_CHILD_AI_CADDIE_FIXTURE_MODE=1\n'
            printf 'SIMCTL_CHILD_AI_CADDIE_DATA_MODE=fixture\n'
            printf 'SIMCTL_CHILD_AI_CADDIE_API_BASE_URL=http://127.0.0.1:9000\n'
          } >> "$GITHUB_ENV"
          export CI=true AI_CADDIE_FIXTURE_PORT=9000
          command -v uv >/dev/null 2>&1 || { echo "uv is required for fixture startup" >&2; exit 1; }
          uv --version
          python3 --version
          nohup bash ops/run_ci_fixture.sh > "$RUNNER_TEMP/ai-caddie-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ai-caddie-fixture.pid"
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:9000/api/v2/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "fixture health check failed" >&2
          if [ -f "$RUNNER_TEMP/ai-caddie-fixture.log" ]; then
            python3 -c 'import os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"ai-caddie-fixture.log"; t=p.read_text(errors="replace"); token=os.environ.get("AI_CADDIE_ADMIN_TOKEN", ""); print(t.replace(token, "[REDACTED]"))'
          fi
          exit 1
      - &upload_fixture_startup_diagnostics
        name: Upload fixture startup diagnostics
        if: ${{ always() && inputs.fixture_mode && steps.start_fixture.outcome == 'failure' }}
        run: |
          set -euo pipefail
          mkdir -p fixture-startup-diagnostics
          if [ -f "$RUNNER_TEMP/ai-caddie-fixture.log" ]; then
            python3 -c 'import os, pathlib; src=pathlib.Path(os.environ["RUNNER_TEMP"])/"ai-caddie-fixture.log"; dst=pathlib.Path("fixture-startup-diagnostics/stderr.log"); token=os.environ.get("AI_CADDIE_ADMIN_TOKEN", ""); dst.write_text(src.read_text(errors="replace").replace(token, "[REDACTED]"), encoding="utf-8")'
          else
            printf '%s\n' 'fixture launcher produced no stderr log' > fixture-startup-diagnostics/stderr.log
          fi
          printf '%s\n' 'fixture startup diagnostics; secrets redacted' > fixture-startup-diagnostics/README.txt
        continue-on-error: true
      - &upload_fixture_startup_diagnostics_artifact
        name: Upload fixture startup diagnostics artifact
        if: ${{ always() && inputs.fixture_mode && steps.start_fixture.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: fixture-startup-diagnostics${{ env.NATIVE_ARTIFACT_SUFFIX }}
          path: fixture-startup-diagnostics/
          if-no-files-found: error
      - &configure_live_native_auth
        name: Configure live native auth
        if: ${{ !inputs.fixture_mode }}
        env:
          LIVE_ADMIN_TOKEN: ${{ secrets.AI_CADDIE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$LIVE_ADMIN_TOKEN"
          echo "::add-mask::$LIVE_ADMIN_TOKEN"
          printf 'AI_CADDIE_ADMIN_TOKEN=%s\n' "$LIVE_ADMIN_TOKEN" >> "$GITHUB_ENV"
          printf 'TEST_RUNNER_AI_CADDIE_ADMIN_TOKEN=%s\n' "$LIVE_ADMIN_TOKEN" >> "$GITHUB_ENV"
          printf 'ARTIFACT_ADMIN_TOKEN=%s\n' "$LIVE_ADMIN_TOKEN" >> "$GITHUB_ENV"
      - &resolve_live_api_host_for_hosted_runners
        name: Resolve live API host for hosted runners
        if: ${{ !inputs.fixture_mode }}
        env:
          NATIVE_BASE_URL: ${{ github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
        run: |
          set -euo pipefail
          API_HOST="$(python3 - "$NATIVE_BASE_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          parsed = urlparse(sys.argv[1])
          print(parsed.hostname or "")
          PY
          )"
          test -n "$API_HOST"

          # Tailscale MagicDNS names are intentionally split-DNS names. Hosted
          # runners are outside the tailnet, so ask the two documented Tailscale
          # resolvers for the Funnel address and preserve the original hostname
          # for SNI/certificate validation.
          if python3 - "$API_HOST" <<'PY'
          import socket
          import sys

          try:
              socket.getaddrinfo(sys.argv[1], 443, type=socket.SOCK_STREAM)
          except OSError:
              raise SystemExit(1)
          PY
          then
            echo "Live API host resolves through the runner DNS: $API_HOST"
            exit 0
          fi

          resolved_ip=""
          for resolver in 199.247.155.53 199.247.152.53; do
            candidate="$(dig +short @"$resolver" "$API_HOST" A 2>/dev/null \
              | awk '/^[0-9]+(\.[0-9]+){3}$/ { print; exit }' || true)"
            if [[ -n "$candidate" ]]; then
              resolved_ip="$candidate"
              echo "Resolved $API_HOST via $resolver -> $resolved_ip"
              break
            fi
          done
          test -n "$resolved_ip"
          printf '%s %s\n' "$resolved_ip" "$API_HOST" | sudo tee -a /etc/hosts >/dev/null
          if command -v dscacheutil >/dev/null 2>&1; then
            sudo dscacheutil -flushcache || true
          fi
          python3 - "$API_HOST" <<'PY'
          import socket
          import sys

          addresses = socket.getaddrinfo(sys.argv[1], 443, type=socket.SOCK_STREAM)
          if not addresses:
              raise SystemExit("live API host did not resolve after /etc/hosts mapping")
          print("Live API addresses:", sorted({row[4][0] for row in addresses}))
          PY
      - &validate_native_launch_prerequisites
        name: Validate native launch prerequisites
        id: validate_native_launch_prereq
        if: ${{ (!inputs.fixture_mode || steps.start_fixture.outcome == 'success') }}
        env:
          NATIVE_BASE_URL: ${{ inputs.fixture_mode && 'http://127.0.0.1:9000' || github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          NATIVE_FIXTURE_MODE: ${{ inputs.fixture_mode && '1' || '0' }}
          NATIVE_DATA_MODE: ${{ inputs.fixture_mode && 'fixture' || '' }}
        run: |
          set -euo pipefail
          printf 'native app launch prerequisites: url_present=%s token_present=%s token_len=%s fixture=%s\n' \
            "$([[ -n "$NATIVE_BASE_URL" ]] && echo true || echo false)" \
            "$([[ -n "${AI_CADDIE_ADMIN_TOKEN:-}" ]] && echo true || echo false)" \
            "${#AI_CADDIE_ADMIN_TOKEN}" "$NATIVE_FIXTURE_MODE"
          test -n "$NATIVE_BASE_URL" && test -n "${AI_CADDIE_ADMIN_TOKEN:-}"
          if [[ "$NATIVE_FIXTURE_MODE" == "1" ]]; then
            test "$NATIVE_BASE_URL" = "http://127.0.0.1:9000"
            test "${AI_CADDIE_FIXTURE_MODE:-}" = "1" && test "${AI_CADDIE_DATA_MODE:-}" = "fixture"
            test "${SIMCTL_CHILD_AI_CADDIE_FIXTURE_MODE:-}" = "1"
            test "${SIMCTL_CHILD_AI_CADDIE_DATA_MODE:-}" = "fixture"
            test "${SIMCTL_CHILD_AI_CADDIE_API_BASE_URL:-}" = "$NATIVE_BASE_URL"
            test "${SIMCTL_CHILD_AI_CADDIE_ADMIN_TOKEN:-}" = "$AI_CADDIE_ADMIN_TOKEN"
          fi
      - &validate_native_launch_environment_app_target
        name: Validate native launch environment (app target)
        id: validate_native_launch_environment_app
        if: ${{ (!inputs.fixture_mode || steps.start_fixture.outcome == 'success') }}
        env:
          NATIVE_BASE_URL: ${{ inputs.fixture_mode && 'http://127.0.0.1:9000' || github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          NATIVE_FIXTURE_MODE: ${{ inputs.fixture_mode && '1' || '0' }}
        run: |
          set -euo pipefail
          printf 'native app launch environment: url_present=%s token_present=%s token_len=%s fixture=%s\n' \
            "$([[ -n "$NATIVE_BASE_URL" ]] && echo true || echo false)" \
            "$([[ -n "${AI_CADDIE_ADMIN_TOKEN:-}" ]] && echo true || echo false)" \
            "${#AI_CADDIE_ADMIN_TOKEN}" "$NATIVE_FIXTURE_MODE"
          test -n "$NATIVE_BASE_URL" && test -n "${AI_CADDIE_ADMIN_TOKEN:-}"
          if [[ "$NATIVE_FIXTURE_MODE" == "1" ]]; then
            test "$NATIVE_BASE_URL" = "http://127.0.0.1:9000"
            test "${AI_CADDIE_FIXTURE_MODE:-}" = "1" && test "${AI_CADDIE_DATA_MODE:-}" = "fixture"
            test "${SIMCTL_CHILD_AI_CADDIE_FIXTURE_MODE:-}" = "1"
            test "${SIMCTL_CHILD_AI_CADDIE_DATA_MODE:-}" = "fixture"
            test "${SIMCTL_CHILD_AI_CADDIE_API_BASE_URL:-}" = "$NATIVE_BASE_URL"
            test "${SIMCTL_CHILD_AI_CADDIE_ADMIN_TOKEN:-}" = "$AI_CADDIE_ADMIN_TOKEN"
          fi
      - &validate_native_launch_environment
        name: Validate native launch environment
        id: validate_native_launch_environment
        if: ${{ (!inputs.fixture_mode || steps.start_fixture.outcome == 'success') }}
        env:
          NATIVE_BASE_URL: ${{ inputs.fixture_mode && 'http://127.0.0.1:9000' || github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || 'https://caddie.taile36706.ts.net' }}
          NATIVE_FIXTURE_MODE: ${{ inputs.fixture_mode && '1' || '0' }}
          NATIVE_DATA_MODE: ${{ inputs.fixture_mode && 'fixture' || '' }}
        run: |
          set -euo pipefail
          token_len=${#AI_CADDIE_ADMIN_TOKEN}
          printf 'native launch contract: url_present=%s token_present=%s token_len=%s fixture=%s data_mode_present=%s\n' \
            "$([[ -n "$NATIVE_BASE_URL" ]] && echo true || echo false)" \
            "$([[ -n "${AI_CADDIE_ADMIN_TOKEN:-}" ]] && echo true || echo false)" \
            "$token_len" "$NATIVE_FIXTURE_MODE" \
            "$([[ -n "$NATIVE_DATA_MODE" ]] && echo true || echo false)"
          test -n "$NATIVE_BASE_URL"
          test -n "${AI_CADDIE_ADMIN_TOKEN:-}"
          if [[ "$NATIVE_FIXTURE_MODE" == "1" ]]; then
            test "$NATIVE_BASE_URL" = "http://127.0.0.1:9000"
            test "${AI_CADDIE_FIXTURE_MODE:-}" = "1"
            test "${AI_CADDIE_DATA_MODE:-}" = "fixture"
            test "${SIMCTL_CHILD_AI_CADDIE_FIXTURE_MODE:-}" = "1"
            test "${SIMCTL_CHILD_AI_CADDIE_DATA_MODE:-}" = "fixture"
            test "${SIMCTL_CHILD_AI_CADDIE_API_BASE_URL:-}" = "$NATIVE_BASE_URL"
            test "$SIMCTL_CHILD_AI_CADDIE_ADMIN_TOKEN" = "$AI_CADDIE_ADMIN_TOKEN"
          else
            test "${AI_CADDIE_FIXTURE_MODE:-0}" != "1"
            test "${SIMCTL_CHILD_AI_CADDIE_FIXTURE_MODE:-0}" != "1"
          fi
      - &test_ios_app_target
        name: Test iOS app target
        id: test_ios_app
        if: ${{ github.event.inputs.capture_scope != 'edit' && (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')) }}
        run: |
          mkdir -p native-mobile-results
          set -o pipefail
          xcodebuild test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddie \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -destination "$IOS_DESTINATION" \
            2>&1 | tee native-mobile-results/ios-app-xcodebuild.log
      - &verify_swiftjcs_consumer_boundaries
        name: Verify SwiftJCS consumer boundaries
        if: ${{ always() && github.event.inputs.capture_scope != 'edit' && steps.test_ios_app.outcome == 'success' }}
        run: |
          set -euo pipefail

          PACKAGE_CONSUMER="$RUNNER_TEMP/swift-package-consumer"
          mkdir -p \
            "$PACKAGE_CONSUMER/Sources/PositiveConsumer" \
            "$PACKAGE_CONSUMER/Sources/ExplicitSwiftJCSConsumer"
          cat > "$PACKAGE_CONSUMER/Package.swift" <<SWIFT
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "ExternalAICaddieConsumer",
              platforms: [.iOS(.v17)],
              dependencies: [
                  .package(name: "AICaddieSource", path: "$GITHUB_WORKSPACE"),
              ],
              targets: [
                  .executableTarget(
                      name: "PositiveConsumer",
                      dependencies: [
                          .product(
                              name: "AICaddieDomain",
                              package: "AICaddieSource"
                          ),
                      ]
                  ),
                  .executableTarget(
                      name: "ExplicitSwiftJCSConsumer",
                      dependencies: [
                          .product(
                              name: "AICaddieDomain",
                              package: "AICaddieSource"
                          ),
                      ]
                  ),
              ]
          )
          SWIFT
          cat > "$PACKAGE_CONSUMER/Sources/PositiveConsumer/main.swift" <<'SWIFT'
          import AICaddieDomain
          let value = JSONValue.null
          _ = try CanonicalJSON.data(value)
          _ = try TypedID.make(domain: "VisibilityProbe/v1", value: value)
          SWIFT
          cat > "$PACKAGE_CONSUMER/Sources/ExplicitSwiftJCSConsumer/main.swift" <<'SWIFT'
          import Foundation
          import SwiftJCS
          _ = try JSONCanonicalization.data(
              withJSONObject: NSNumber(value: -0.0)
          )
          SWIFT
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          ARCH=$(uname -m)
          swift build \
            --package-path "$PACKAGE_CONSUMER" \
            --triple "$ARCH-apple-ios17.0-simulator" \
            --sdk "$SDK" \
            --target PositiveConsumer
          set +e
          SWIFTPM_DIAGNOSTIC=$(swift build \
            --package-path "$PACKAGE_CONSUMER" \
            --triple "$ARCH-apple-ios17.0-simulator" \
            --sdk "$SDK" \
            --target ExplicitSwiftJCSConsumer 2>&1)
          SWIFTPM_STATUS=$?
          set -e
          printf '%s\n' "$SWIFTPM_DIAGNOSTIC"
          if [ "$SWIFTPM_STATUS" -eq 0 ]; then
            echo "SwiftPM source-build audit harness exposes transitively reachable SwiftJCS by design"
          elif grep -F "no such module 'SwiftJCS'" \
            <<< "$SWIFTPM_DIAGNOSTIC"; then
            echo "SwiftPM toolchain now isolates SwiftJCS from the source-build audit harness"
          else
            echo "::error::SwiftPM negative consumer failed for an unexpected reason"
            exit 1
          fi

          DOMAIN_FRAMEWORK=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -path '*/Build/Products/Debug-iphonesimulator/AICaddieDomain.framework' \
            -print -quit)
          test -n "$DOMAIN_FRAMEWORK"
          FRAMEWORK_ARTIFACT="$RUNNER_TEMP/aicaddie-domain-artifact"
          mkdir -p "$FRAMEWORK_ARTIFACT"
          ditto \
            "$DOMAIN_FRAMEWORK" \
            "$FRAMEWORK_ARTIFACT/AICaddieDomain.framework"
          test ! -e "$FRAMEWORK_ARTIFACT/SwiftJCS.swiftmodule"
          test ! -e "$FRAMEWORK_ARTIFACT/libSwiftJCS.a"
          POSITIVE_CONSUMER="$RUNNER_TEMP/AICaddieDomainPositiveConsumer.swift"
          cat > "$POSITIVE_CONSUMER" <<'SWIFT'
          import AICaddieDomain
          func verifyPublicWrapper() throws {
              let value = JSONValue.null
              _ = try CanonicalJSON.data(value)
              _ = try TypedID.make(domain: "VisibilityProbe/v1", value: value)
          }
          SWIFT
          CONSUMER="$RUNNER_TEMP/AICaddieDomainConsumer.swift"
          cat > "$CONSUMER" <<'SWIFT'
          import SwiftJCS
          _ = try JSONCanonicalization.data(
              withJSONObject: ["unchecked": -0.0]
          )
          SWIFT
          xcrun swiftc -typecheck \
            -target "$ARCH-apple-ios17.0-simulator" \
            -sdk "$SDK" \
            -F "$FRAMEWORK_ARTIFACT" \
            "$POSITIVE_CONSUMER"
          set +e
          FRAMEWORK_DIAGNOSTIC=$(xcrun swiftc -typecheck \
            -target "$ARCH-apple-ios17.0-simulator" \
            -sdk "$SDK" \
            -F "$FRAMEWORK_ARTIFACT" \
            "$CONSUMER" 2>&1)
          FRAMEWORK_STATUS=$?
          set -e
          printf '%s\n' "$FRAMEWORK_DIAGNOSTIC"
          test "$FRAMEWORK_STATUS" -ne 0
          grep -F "no such module 'SwiftJCS'" <<< "$FRAMEWORK_DIAGNOSTIC"
      - &collect_design_snapshots

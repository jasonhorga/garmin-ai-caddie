              # native-product-ui job; here it would collide with the Python fixture.
              ONLY_TESTING=(
                -skip-testing:AICaddieUITests/ProductPhoneUITests
              )
              ;;
          esac
          # Fixture shards partition the scope above; live dispatch uses the original selection.
          case "$NATIVE_CAPTURE_SHARD" in
            real-flow)
              ONLY_TESTING=(-only-testing:AICaddieUITests/RealFlowUITests/testCaptureRealAppFlow)
              ;;
            screenshots)
              ONLY_TESTING+=(-skip-testing:AICaddieUITests/RealFlowUITests/testCaptureRealAppFlow)
              ;;
          esac
          .github/scripts/retry-transient-command.sh \
            "$RUNNER_TEMP/real-xcuitest" \
            xcodebuild test \
              -project mobile/ios/AICaddieNative.xcodeproj \
              -scheme AICaddieUITests \
              -destination "platform=iOS Simulator,id=$UDID" \
              -parallel-testing-enabled NO \
              "${ONLY_TESTING[@]}"
          TEST_STATUS=$?
          set -e
          kill -INT "$REC_PID" 2>/dev/null || true
          sleep 4
          if [[ "$NATIVE_CAPTURE_SHARD" == "screenshots" && "$UITEST_CAPTURE_SCOPE" != "edit" ]]; then
            if [ -f real-videos/real-flow.mp4 ]; then
              mv real-videos/real-flow.mp4 real-videos/screenshots.mp4
            else
              echo '::warning::Screenshot shard recording is missing; preserving UI test status'
            fi
          fi
          ls -la real-videos || true
          # Surface each UI-test assertion as a job annotation: the inline xcodebuild failure line
          # scrolls out of the retained log tail on a full run.
          if [ "$TEST_STATUS" -ne 0 ]; then
            RESULT=$(ls -td "$HOME"/Library/Developer/Xcode/DerivedData/*/Logs/Test/Test-AICaddieUITests-*.xcresult 2>/dev/null | head -1)
            if [ -n "$RESULT" ]; then
              xcrun xcresulttool get test-results summary --path "$RESULT" --compact 2>/dev/null \
                | python3 -c 'import json, sys
          for f in json.load(sys.stdin).get("testFailures", []):
              name = f.get("testIdentifierString") or f.get("testName") or "UI test"
              text = " ".join(str(f.get("failureText", "")).split())[:900]
              print(f"::error title=UI test failure::{name} :: {text}")' || true
            fi
          fi
          exit "$TEST_STATUS"
      - &collect_real_screenshots

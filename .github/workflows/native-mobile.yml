      - name: Write native build evidence
        if: ${{ always() && github.event.inputs.capture_scope != 'edit' }}
        env:
          NATIVE_EVENT_NAME: ${{ github.event_name }}
          NATIVE_CAPTURE_SCOPE: ${{ github.event.inputs.capture_scope || 'full' }}
          IOS_TARGET_OUTCOME: ${{ steps.test_ios_app.outcome }}
          IOS_CAPTURE_OUTCOME: ${{ steps.real_ios_capture.outcome }}
          WATCH_TEST_OUTCOME: ${{ steps.test_watch_app.outcome }}
          FIXTURE_MODE: ${{ inputs.fixture_mode }}
          FIXTURE_START_OUTCOME: ${{ steps.start_fixture.outcome }}
          LAUNCH_VALIDATION_OUTCOME: ${{ steps.validate_native_launch_environment.outcome }}
          LAUNCH_PREREQ_OUTCOME: ${{ steps.validate_native_launch_prereq.outcome }}
        run: &write_native_build_evidence_script |
          status_from_outcome() {
            case "$1" in
              success) echo "passed" ;;
              failure) echo "failed" ;;
              cancelled|skipped|*) echo "skipped" ;;
            esac
          }
          ios_status="$(status_from_outcome "$IOS_TARGET_OUTCOME")"
          if [[ "$IOS_TARGET_OUTCOME" == "success" && "$NATIVE_EVENT_NAME" == "workflow_dispatch" ]]; then
            ios_status="$(status_from_outcome "$IOS_CAPTURE_OUTCOME")"
          fi
          if [[ "$FIXTURE_MODE" == "true" && "$FIXTURE_START_OUTCOME" != "success" ]]; then
            ios_status="skipped"
          fi
          if [[ "$FIXTURE_MODE" == "true" && "$LAUNCH_VALIDATION_OUTCOME" != "success" ]]; then
            ios_status="skipped"
          fi
          if [[ "$FIXTURE_MODE" == "true" && "$LAUNCH_PREREQ_OUTCOME" != "success" ]]; then
            ios_status="skipped"
          fi
          watch_status="passed"
          if [[ "$NATIVE_EVENT_NAME" == "workflow_dispatch" && "$NATIVE_CAPTURE_SCOPE" != "full" ]]; then
            watch_status="skipped"
          else
            watch_status="$(status_from_outcome "$WATCH_TEST_OUTCOME")"
          fi
          if [[ "$FIXTURE_MODE" == "true" && "$FIXTURE_START_OUTCOME" != "success" ]]; then
            watch_status="skipped"
          fi
          if [[ "$FIXTURE_MODE" == "true" && "$LAUNCH_VALIDATION_OUTCOME" != "success" ]]; then
            watch_status="skipped"
          fi
          if [[ "$FIXTURE_MODE" == "true" && "$LAUNCH_PREREQ_OUTCOME" != "success" ]]; then
            watch_status="skipped"
          fi
          fixture_arg=""
          if [[ "${{ inputs.fixture_mode }}" == "true" ]]; then fixture_arg="--data-mode ci_fixture"; fi
          python3 ops/write_native_build_evidence.py --ios-status "$ios_status" --watch-status "$watch_status" $fixture_arg
      - &scan_native_build_evidence_for_secret_bytes
        name: Scan native build evidence for secret bytes
        id: scan_native_build_evidence
        if: ${{ always() && github.event.inputs.capture_scope != 'edit' && (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')) }}
        run: python3 .github/scripts/scan_artifacts_for_secrets.py --secret-env ARTIFACT_ADMIN_TOKEN mobile/ios/native_build_evidence.json
      - &upload_native_build_evidence
        name: Upload native build evidence
        if: always() && (github.event.inputs.capture_scope != 'edit' && steps.scan_native_build_evidence.outcome == 'success' && (!inputs.fixture_mode || (steps.start_fixture.outcome == 'success' && steps.validate_native_launch_prereq.outcome == 'success' && steps.validate_native_launch_environment_app.outcome == 'success' && steps.validate_native_launch_environment.outcome == 'success')))
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ inputs.fixture_mode && 'native-build-evidence-ci-fixture' || 'native-build-evidence' }}${{ env.NATIVE_ARTIFACT_SUFFIX }}
          path: mobile/ios/native_build_evidence.json


  # Four independent macOS runners; no cross-runner build transfer or fixture sharing.


name: Agenthub Native Mutant
run-name: agenthub-native ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Agenthub request identifier
        required: true
        type: string
      head_sha:
        description: Head revision to test
        required: true
        type: string
      patch_b64:
        description: Base64 mutant patch, empty for a baseline
        required: false
        default: ''
        type: string
      only_testing:
        description: Optional xcodebuild -only-testing value (or comma-separated values)
        required: false
        default: ''
        type: string
      include_ui:
        description: Also run the AICaddieUITests application-test scheme
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-mutant:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The writer must exist even when the tested head predates this workflow.
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: native-tools
          persist-credentials: false
      - name: Check out head under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          path: native-head
          persist-credentials: false
      - name: Validate dispatch inputs
        id: validate
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          request_id = os.environ["REQUEST_ID"]
          head = os.environ["HEAD_SHA"]
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", request_id):
              raise SystemExit("invalid request_id")
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("invalid head_sha")
          PY
      - name: Apply mutant patch
        id: apply
        continue-on-error: true
        if: ${{ steps.validate.outcome == 'success' }}
        working-directory: native-head
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
          PATCH_FILE: ${{ runner.temp }}/native-patch.bin
        run: |
          python3 - <<'PY'
          import base64
          import os
          import subprocess

          from pathlib import Path

          encoded = os.environ['PATCH_B64']
          patch = base64.b64decode(encoded, validate=True) if encoded else b''
          Path(os.environ['PATCH_FILE']).write_bytes(patch)
          if patch:
              subprocess.run(['git', 'apply', '--whitespace=nowarn', '-'], input=patch, check=True)
          PY
      - name: Select available simulators by UDID
        id: simulators
        if: ${{ steps.validate.outcome == 'success' && steps.apply.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          inventory = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], text=True
          ))['devices']

          def newest(platform, name):
              candidates = []
              for runtime, devices in inventory.items():
                  version = re.search(rf'\.{platform}-(\d+)-(\d+)(?:-|$)', runtime)
                  if version is None:
                      continue
                  for device in devices:
                      if device.get('isAvailable') is True and device.get('name') == name:
                          candidates.append((tuple(map(int, version.groups())), device['udid']))
              if not candidates:
                  raise SystemExit(f'No available simulator: {name}')
              return max(candidates)[1]

          ios = newest('iOS', 'iPhone 16')
          watch = newest('watchOS', 'Apple Watch Series 10 (46mm)')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'IOS_UDID={ios}\nWATCH_UDID={watch}\n')
          PY
      - name: Install XcodeGen
        id: install
        if: ${{ steps.validate.outcome == 'success' && steps.apply.outcome == 'success' }}
        run: brew install xcodegen
      - name: Generate native project
        id: generate
        if: ${{ steps.validate.outcome == 'success' && steps.apply.outcome == 'success' }}
        continue-on-error: true
        working-directory: native-head
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .
      - name: Test iPhone scheme
        id: ios
        if: ${{ steps.validate.outcome == 'success' && steps.generate.outcome == 'success' }}
        continue-on-error: true
        working-directory: native-head
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          args=(test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddie \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -resultBundlePath "$RUNNER_TEMP/native-ios.xcresult")
          if [[ -n "$ONLY_TESTING" && "$ONLY_TESTING" != AICaddieWatchTests/* && "$ONLY_TESTING" != AICaddieUITests/* ]]; then
            IFS=',' read -ra tests <<< "$ONLY_TESTING"
            for test in "${tests[@]}"; do args+=("-only-testing:$test"); done
          fi
          xcodebuild "${args[@]}"
      - name: Test Watch scheme
        id: watch
        if: ${{ steps.validate.outcome == 'success' && steps.generate.outcome == 'success' }}
        continue-on-error: true
        working-directory: native-head
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          args=(test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieWatch \
            -destination "platform=watchOS Simulator,id=$WATCH_UDID" \
            -resultBundlePath "$RUNNER_TEMP/native-watch.xcresult")
          if [[ -n "$ONLY_TESTING" && "$ONLY_TESTING" == AICaddieWatchTests/* ]]; then
            IFS=',' read -ra tests <<< "$ONLY_TESTING"
            for test in "${tests[@]}"; do args+=("-only-testing:$test"); done
          fi
          xcodebuild "${args[@]}"
      - name: Test iPhone UI scheme
        id: ui
        if: ${{ inputs.include_ui && steps.validate.outcome == 'success' && steps.generate.outcome == 'success' }}
        continue-on-error: true
        working-directory: native-head
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          args=(test \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieUITests \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -resultBundlePath "$RUNNER_TEMP/native-ui.xcresult")
          if [[ -n "$ONLY_TESTING" && "$ONLY_TESTING" == AICaddieUITests/* ]]; then
            IFS=',' read -ra tests <<< "$ONLY_TESTING"
            for test in "${tests[@]}"; do args+=("-only-testing:$test"); done
          fi
          xcodebuild "${args[@]}"
      - name: Write native result
        id: write_result
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && (steps.apply.outcome == 'failure' || (steps.simulators.outcome == 'success' && steps.install.outcome == 'success' && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure'))) }}
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PATCH_FILE: ${{ runner.temp }}/native-patch.bin
        run: |
          if [ "$APPLY_OUTCOME" = "failure" ]; then
            STAGE=apply_failed
          elif [ "$GENERATE_OUTCOME" = "failure" ]; then
            STAGE=build_failed
          else
            STAGE=tested
          fi
          python3 native-tools/.github/scripts/agenthub_native_result.py \
            --request-id "$REQUEST_ID" \
            --head "$HEAD_SHA" \
            --patch "$PATCH_FILE" \
            --stage "$STAGE" \
            --ios-result "$RUNNER_TEMP/native-ios.xcresult" \
            --watch-result "$RUNNER_TEMP/native-watch.xcresult" \
            --out native-verdict/result.json
      - name: Upload native result
        if: ${{ !cancelled() && steps.write_result.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-native-${{ inputs.request_id }}
          path: native-verdict/result.json
          if-no-files-found: error

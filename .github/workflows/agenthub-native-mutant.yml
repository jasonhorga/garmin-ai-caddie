name: Agenthub Native Mutant
run-name: agenthub-native ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Agenthub request identifier
        required: true
        type: string
      head_sha:
        description: Head revision to test
        required: true
        type: string
      patch_b64:
        description: Base64 mutant patch, empty for a baseline
        required: false
        default: ''
        type: string
      only_testing:
        description: Optional xcodebuild -only-testing value (or comma-separated values)
        required: false
        default: ''
        type: string
      include_ui:
        description: Also run the AICaddieUITests application-test scheme
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-mutant:
    # Xcode 27 exists only on the self-hosted Mac; offline runs stop at Select Xcode 27
    # without writing a verdict, so a mutant is never judged on another Xcode.
    runs-on: ${{ vars.MAC_RUNNER == 'online' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "caddie-mba"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode_path=""
          if [[ -d /Applications/Xcode.app ]]; then
            xcode_path="/Applications/Xcode.app"
          else
            for candidate in /Applications/Xcode_27*.app; do
              if [[ -d "$candidate" ]]; then
                xcode_path="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$xcode_path" ]]; then
            # vars.MAC_RUNNER routes here (ubuntu-latest) while the Mac is offline.
            echo "::error title=Xcode 27 unavailable::Xcode 27 installation not found. Only the self-hosted caddie-mba Mac has Xcode 27 (GitHub-hosted images stop at Xcode 26); this job stops instead of testing with another Xcode. Re-run once the Mac runner is online."
            exit 1
          fi
          developer_dir="$xcode_path/Contents/Developer"
          export DEVELOPER_DIR="$developer_dir"
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -q '^Xcode 27\.' || {
            echo "::error title=Xcode 27 unavailable::selected Xcode is not major version 27"
            exit 1
          }
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
      # The writer must exist even when the tested head predates this workflow.
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: native-tools
          persist-credentials: false
      - name: Select runner fixture port
        id: fixture_port
        if: ${{ inputs.include_ui }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 native-tools/.github/scripts/fixture-port.py select
      - name: Check out head under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          path: native-head
          persist-credentials: false
      - name: Validate dispatch inputs
        id: validate
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          request_id = os.environ["REQUEST_ID"]
          head = os.environ["HEAD_SHA"]
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", request_id):
              raise SystemExit("invalid request_id")
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("invalid head_sha")
          PY
      - name: Apply mutant patch
        id: apply
        continue-on-error: true
        if: ${{ steps.validate.outcome == 'success' }}
        working-directory: native-head
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
          PATCH_FILE: ${{ runner.temp }}/native-patch.bin
        run: |
          python3 - <<'PY'
          import base64
          import os
          import subprocess

          from pathlib import Path

          encoded = os.environ['PATCH_B64']
          patch = base64.b64decode(encoded, validate=True) if encoded else b''
          Path(os.environ['PATCH_FILE']).write_bytes(patch)
          if patch:
              subprocess.run(['git', 'apply', '--whitespace=nowarn', '-'], input=patch, check=True)
          PY
      - name: Select available simulators by UDID
        id: simulators
        if: ${{ steps.validate.outcome == 'success' && steps.apply.outcome == 'success' }}
        run: |
          set -euo pipefail
          IOS_UDID=$(bash native-tools/.github/scripts/select-sim.sh ios)
          WATCH_UDID=$(bash native-tools/.github/scripts/select-sim.sh watch)
          echo "IOS_UDID=$IOS_UDID" >> "$GITHUB_ENV"
          echo "WATCH_UDID=$WATCH_UDID" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        id: install
        if: ${{ steps.validate.outcome == 'success' && steps.apply.outcome == 'success' }}
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate native project
        id: generate
        if: ${{ steps.validate.outcome == 'success' && steps.apply.outcome == 'success' }}
        continue-on-error: true
        working-directory: native-head
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .
      - name: Select native test schemes
        id: schemes
        if: ${{ steps.generate.outcome == 'success' }}
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          python3 - <<'PY'
          import os

          values = [part.strip() for part in os.environ.get("ONLY_TESTING", "").split(",") if part.strip()]
          all_ui = bool(values) and all(value.startswith("AICaddieUITests/") for value in values)
          all_watch = bool(values) and all(value.startswith("AICaddieWatchTests/") for value in values)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ios={'false' if all_ui or all_watch else 'true'}\n")
              output.write(f"watch={'true' if all_watch or not values else 'false'}\n")
          PY
      - name: Test iPhone scheme
        id: ios
        if: ${{ steps.validate.outcome == 'success' && steps.generate.outcome == 'success' && steps.schemes.outputs.ios == 'true' }}
        continue-on-error: true
        working-directory: native-head
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          # Warm the selected destination while xcodebuild compiles. Keep xcodebuild
          # authoritative for failures, including an unavailable simulator.
          (
            xcrun simctl boot "$IOS_UDID" || true
            xcrun simctl bootstatus "$IOS_UDID" -b
          ) > "$RUNNER_TEMP/native-ios-boot.log" 2>&1 &
          args=(test \
            -derivedDataPath "$RUNNER_TEMP/NativeMutantDerivedData" \
            -parallel-testing-enabled NO \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddie \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -resultBundlePath "$RUNNER_TEMP/native-ios.xcresult")
          if [[ -n "$ONLY_TESTING" && "$ONLY_TESTING" != AICaddieWatchTests/* && "$ONLY_TESTING" != AICaddieUITests/* ]]; then
            IFS=',' read -ra tests <<< "$ONLY_TESTING"
            for test in "${tests[@]}"; do args+=("-only-testing:$test"); done
          fi
          xcodebuild "${args[@]}"
      - name: Test Watch scheme
        id: watch
        if: ${{ steps.validate.outcome == 'success' && steps.generate.outcome == 'success' && steps.schemes.outputs.watch == 'true' }}
        continue-on-error: true
        working-directory: native-head
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          set -euo pipefail
          if [ -n "${CADDIE_SIM_PREFIX:-}" ]; then
            xcrun simctl boot "$WATCH_UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$WATCH_UDID" -b
            xcrun simctl privacy "$WATCH_UDID" grant location com.ai-caddie.mobile.watchkitapp
          fi
          args=(test \
            -derivedDataPath "$RUNNER_TEMP/NativeMutantDerivedData" \
            -parallel-testing-enabled NO \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieWatch \
            -destination "platform=watchOS Simulator,id=$WATCH_UDID" \
            -resultBundlePath "$RUNNER_TEMP/native-watch.xcresult")
          if [[ -n "$ONLY_TESTING" && "$ONLY_TESTING" == AICaddieWatchTests/* ]]; then
            IFS=',' read -ra tests <<< "$ONLY_TESTING"
            for test in "${tests[@]}"; do args+=("-only-testing:$test"); done
          fi
          xcodebuild "${args[@]}"
      - name: Prepare UI mutant fixture port
        if: ${{ inputs.include_ui && steps.fixture_port.outcome == 'success' }}
        run: python3 native-tools/.github/scripts/fixture-port.py prepare
      - name: Test iPhone UI scheme
        id: ui
        if: ${{ inputs.include_ui && steps.fixture_port.outcome == 'success' && steps.validate.outcome == 'success' && steps.generate.outcome == 'success' }}
        continue-on-error: true
        working-directory: native-head
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          args=(test \
            -derivedDataPath "$RUNNER_TEMP/NativeMutantDerivedData" \
            -parallel-testing-enabled NO \
            -project mobile/ios/AICaddieNative.xcodeproj \
            -scheme AICaddieUITests \
            -destination "platform=iOS Simulator,id=$IOS_UDID" \
            -resultBundlePath "$RUNNER_TEMP/native-ui.xcresult")
          if [[ -n "$ONLY_TESTING" && "$ONLY_TESTING" == AICaddieUITests/* ]]; then
            IFS=',' read -ra tests <<< "$ONLY_TESTING"
            for test in "${tests[@]}"; do args+=("-only-testing:$test"); done
          fi
          xcodebuild "${args[@]}"
      - name: Write native result
        id: write_result
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && (steps.apply.outcome == 'failure' || (steps.simulators.outcome == 'success' && steps.install.outcome == 'success' && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure'))) }}
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          INCLUDE_UI: ${{ inputs.include_ui }}
          SKIP_IOS: ${{ steps.schemes.outputs.ios == 'false' }}
          SKIP_WATCH: ${{ steps.schemes.outputs.watch == 'false' }}
          PATCH_FILE: ${{ runner.temp }}/native-patch.bin
        run: |
          if [ "$APPLY_OUTCOME" = "failure" ]; then
            STAGE=apply_failed
          elif [ "$GENERATE_OUTCOME" = "failure" ]; then
            STAGE=build_failed
          else
            STAGE=tested
          fi
          writer_args=(
            --request-id "$REQUEST_ID" \
            --head "$HEAD_SHA" \
            --patch "$PATCH_FILE" \
            --stage "$STAGE" \
            --ios-result "$RUNNER_TEMP/native-ios.xcresult" \
            --watch-result "$RUNNER_TEMP/native-watch.xcresult" \
            --out native-verdict/result.json)
          if [ "$INCLUDE_UI" = "true" ]; then
            writer_args+=(--ui-result "$RUNNER_TEMP/native-ui.xcresult")
          fi
          if [ "$SKIP_IOS" = "true" ]; then
            writer_args+=(--skip-ios)
          fi
          if [ "$SKIP_WATCH" = "true" ]; then
            writer_args+=(--skip-watch)
          fi
          python3 native-tools/.github/scripts/agenthub_native_result.py "${writer_args[@]}"
      - name: Upload native result
        if: ${{ !cancelled() && steps.write_result.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-native-${{ inputs.request_id }}
          path: native-verdict/result.json
          if-no-files-found: error
      - name: Shut down owned simulators
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: bash native-tools/.github/scripts/shutdown-owned-sims.sh
      - name: Check UI mutant fixture stopped
        if: ${{ always() && inputs.include_ui && steps.fixture_port.outcome == 'success' }}
        run: python3 native-tools/.github/scripts/fixture-port.py free

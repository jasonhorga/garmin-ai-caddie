name: iOS TestFlight (CD)

# Build the AI Caddie iOS app (with embedded watch app) and upload to TestFlight — on a
# The self-hosted caddie-mba runner provides Xcode 27. Signing uses fastlane match
# (run the one-time ios-signing-bootstrap workflow first).

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'TestFlight changelog'
        required: false
        default: 'Automated CI build'
      api_base_url:
        description: 'Optional public API base URL to bake into the TestFlight app'
        required: false
        default: ''
      upload_to_testflight:
        description: 'Upload the signed IPA to TestFlight (false builds an artifact only)'
        type: boolean
        required: true
        default: false
      test_environment_upload:
        description: 'Owner-approved test-environment upload; permits degraded operational readiness only'
        type: boolean
        required: true
        default: false
      expected_backend_revision:
        description: 'Expected deployed backend Git revision (40 hex characters)'
        required: false
        default: ''

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, caddie-mba]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          xcode_path=""
          if [[ -d /Applications/Xcode.app ]]; then
            xcode_path="/Applications/Xcode.app"
          else
            for candidate in /Applications/Xcode_27*.app; do
              if [[ -d "$candidate" ]]; then
                xcode_path="$candidate"
                break
              fi
            done
          fi
          [[ -n "$xcode_path" ]] || { echo "Xcode 27 installation not found" >&2; exit 1; }
          developer_dir="$xcode_path/Contents/Developer"
          export DEVELOPER_DIR="$developer_dir"
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -q '^Xcode 27\.' || {
            echo "selected Xcode is not major version 27" >&2
            exit 1
          }
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"

      - name: Verify self-hosted build tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v rbenv >/dev/null 2>&1; then
            eval "$(rbenv init -)"
          fi
          command -v ruby
          command -v bundle
          ruby --version
          bundle --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          command -v xcodegen
          bundle install --jobs 4 --retry 3

      - name: Prepare temporary signing keychain
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/aicaddie-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          keychain_snapshot="$RUNNER_TEMP/aicaddie-keychains-before.txt"
          security list-keychains -d user > "$keychain_snapshot"
          printf 'MATCH_KEYCHAIN_NAME=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          printf 'MATCH_KEYCHAIN_DEFAULT=false\n' >> "$GITHUB_ENV"
          printf 'MATCH_KEYCHAIN_SNAPSHOT=%s\n' "$keychain_snapshot" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate --spec mobile/ios/project.yml --project-root .

      - name: Validate signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_PRIVATE_KEY; do
            eval "val=\${$v}"
            test -n "$val" || { echo "❌ Missing secret: $v (run ios-signing-bootstrap first)"; exit 1; }
          done

      - name: Validate upload origin
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          API_ORIGIN: ${{ github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || '' }}
        run: |
          python3 - "$API_ORIGIN" <<'PY'
          import sys
          import ipaddress
          from urllib.parse import urlparse
          p = urlparse(sys.argv[1])
          host = (p.hostname or "").lower()
          try:
              ip = ipaddress.ip_address(host)
              private = (
                  ip.is_private
                  or ip.is_loopback
                  or ip.is_link_local
                  or ip.is_reserved
                  or ip.is_multicast
                  or ip.is_unspecified
              )
          except ValueError:
              private = host == "localhost" or host.endswith(".local")
          if p.scheme != "https" or not host or private or p.username or p.password or p.query or p.fragment or p.path not in ("", "/"):
              raise SystemExit("upload_to_testflight requires an origin-only public HTTPS API URL")
          PY

      - name: fastlane beta -> TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          AI_CADDIE_ADMIN_TOKEN: ${{ secrets.AI_CADDIE_ADMIN_TOKEN }}
          EXPECTED_BACKEND_REVISION: ${{ github.event.inputs.expected_backend_revision || vars.AI_CADDIE_BACKEND_REVISION || '' }}
          AI_CADDIE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.AI_CADDIE_API_BASE_URL || '' }}
          UPLOAD_TO_TESTFLIGHT: ${{ github.event.inputs.upload_to_testflight || 'false' }}
          ALLOW_TEST_ENVIRONMENT_UPLOAD: ${{ github.event.inputs.test_environment_upload || 'false' }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AICaddie-ipa
          path: |
            build/ios/*.ipa
            build/ios/release-provenance.json
          if-no-files-found: ignore

      - name: Restore signing keychain search list
        if: always()
        shell: bash
        run: |
          set -u
          restore_status=0
          if [[ -f "${MATCH_KEYCHAIN_SNAPSHOT:-}" ]]; then
            keychains=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && keychains+=("$keychain")
            done < <(sed -n 's/^[[:space:]]*"\(.*\)"$/\1/p' "$MATCH_KEYCHAIN_SNAPSHOT")
            if (( ${#keychains[@]} )); then
              security list-keychains -d user -s "${keychains[@]}" || restore_status=$?
            fi
          fi
          if [[ -n "${MATCH_KEYCHAIN_NAME:-}" ]]; then
            security delete-keychain "$MATCH_KEYCHAIN_NAME" >/dev/null 2>&1 || true
          fi
          exit "$restore_status"

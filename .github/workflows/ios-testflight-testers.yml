name: iOS TestFlight Testers

# Manage TestFlight tester visibility after a binary has uploaded. This is
# manual-only because tester emails and external distribution are user-specific.
# Private distribution defaults to the existing internal group; external
# tester/review/distribution operations require an explicit opt-in.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Manage testers or diagnose an uploaded IPA'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - add
          - assign_existing
          - configure_review
          - submit_review
          - distribute
          - diagnose_artifact
      tester_emails:
        description: 'Comma/newline-separated external tester emails for add'
        required: false
        default: ''
      groups:
        description: 'Comma-separated external TestFlight group names (external_distribution=true only)'
        required: false
        default: 'Private Trial'
      internal_group:
        description: 'Existing internal TestFlight group for private distribution'
        required: false
        default: "Jason's friends"
      external_distribution:
        description: 'Opt in to external tester, review, and distribution operations'
        required: false
        default: false
        type: boolean
      app_version:
        description: 'Optional TestFlight app version to distribute'
        required: false
        default: ''
      build_number:
        description: 'Optional TestFlight build number to distribute'
        required: false
        default: ''
      notify_external_testers:
        description: 'Notify external testers on distribute'
        required: false
        default: false
        type: boolean
      source_run_id:
        description: 'Source TestFlight workflow run for diagnose_artifact'
        required: false
        default: ''
      diagnose_bundles:
        description: 'Print Apple-processed build bundle metadata for list'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-testflight-testers
  cancel-in-progress: false

jobs:
  testers:
    if: ${{ github.event.inputs.operation != 'diagnose_artifact' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Validate App Store Connect secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            eval "val=\${$v}"
            test -n "$val" || { echo "Missing secret: $v"; exit 1; }
          done

      - name: Write transient App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_path = Path(os.environ["RUNNER_TEMP"]) / "asc_api_key.json"
          private_key = os.environ["ASC_PRIVATE_KEY"].replace("\\n", "\n").replace("\r", "").strip()
          key_path.write_text(
              json.dumps(
                  {
                      "key_id": os.environ["ASC_KEY_ID"],
                      "issuer_id": os.environ["ASC_ISSUER_ID"],
                      "key": private_key,
                      "in_house": False,
                  }
              ),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ASC_API_KEY_PATH={key_path}\n")
          PY

      - name: Manage TestFlight testers
        env:
          OPERATION: ${{ github.event.inputs.operation }}
          TESTER_EMAILS: ${{ github.event.inputs.tester_emails }}
          TESTFLIGHT_GROUPS: ${{ github.event.inputs.groups }}
          INTERNAL_TESTFLIGHT_GROUP: ${{ github.event.inputs.internal_group }}
          APP_VERSION: ${{ github.event.inputs.app_version }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.TESTFLIGHT_FEEDBACK_EMAIL }}
          TESTFLIGHT_REVIEW_CONTACT_EMAIL: ${{ secrets.TESTFLIGHT_REVIEW_CONTACT_EMAIL }}
          TESTFLIGHT_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.TESTFLIGHT_REVIEW_CONTACT_FIRST_NAME }}
          TESTFLIGHT_REVIEW_CONTACT_LAST_NAME: ${{ secrets.TESTFLIGHT_REVIEW_CONTACT_LAST_NAME }}
          TESTFLIGHT_REVIEW_CONTACT_PHONE: ${{ secrets.TESTFLIGHT_REVIEW_CONTACT_PHONE }}
          NOTIFY_EXTERNAL_TESTERS: ${{ github.event.inputs.notify_external_testers }}
          EXTERNAL_DISTRIBUTION: ${{ github.event.inputs.external_distribution }}
          DIAGNOSE_BUNDLES: ${{ github.event.inputs.diagnose_bundles }}
        run: |
          set -euo pipefail
          bundle exec ruby - <<'RUBY'
          require "json"
          require "spaceship/connect_api"
          require "spaceship/connect_api/spaceship"

          APP_IDENTIFIER = "com.ai-caddie.mobile"
          DEFAULT_INTERNAL_TESTFLIGHT_GROUP = "Jason's friends"
          DEFAULT_EXTERNAL_TESTFLIGHT_GROUP = "Private Trial"
          DEFAULT_BETA_APP_DESCRIPTION = (
            "Private TestFlight build for validating AI Caddie golf history, " \
            "course prep, and iOS/watchOS trial flows."
          )
          DEFAULT_BETA_APP_REVIEW_NOTES = (
            "No demo account is required. This private trial validates AI Caddie " \
            "golf history, course prep, and iOS/watchOS trial flows."
          )

          def blank_to_nil(value)
            stripped = value.to_s.strip
            stripped.empty? ? nil : stripped
          end

          def parse_group_names(value, default_name: DEFAULT_EXTERNAL_TESTFLIGHT_GROUP)
            names = value.to_s.split(",").map(&:strip).reject(&:empty?).uniq
            names.empty? ? [default_name] : names
          end

          def parse_tester_emails(value)
            value.to_s.split(/[\s,]+/).map(&:strip).reject(&:empty?).uniq
          end

          def redact_email(email)
            local, domain = email.to_s.split("@", 2)
            return "(invalid email)" if local.nil? || domain.nil?

            visible = local.length <= 2 ? local[0].to_s : local[0, 2]
            "#{visible}***@#{domain}"
          end

          def bool_input?(value)
            value.to_s.strip.downcase == "true"
          end

          def describe(value)
            value.nil? ? "unknown" : value.to_s
          end

          def safely
            yield
          rescue => e
            "unavailable: #{e.class}"
          end

          def connect_api!
            api_key = JSON.parse(File.read(ENV.fetch("ASC_API_KEY_PATH")))
            Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
              key_id: api_key.fetch("key_id"),
              issuer_id: api_key.fetch("issuer_id"),
              key: api_key.fetch("key"),
              in_house: api_key.fetch("in_house", false)
            )
          end

          def find_app!
            app = Spaceship::ConnectAPI::App.find(APP_IDENTIFIER)
            raise "App Store Connect app not found for #{APP_IDENTIFIER}" unless app

            app
          end

          def fetch_builds(app, app_version, build_number, limit: 20)
            Spaceship::ConnectAPI::Build.all(
              app_id: app.id,
              version: app_version,
              build_number: build_number,
              platform: "IOS",
              sort: "-uploadedDate",
              limit: limit
            )
          end

          def print_builds(app, app_version, build_number)
            builds = fetch_builds(app, app_version, build_number)
            puts "::group::TestFlight builds"
            if builds.empty?
              puts "No TestFlight builds found."
            else
              builds.each do |build|
                detail = build.build_beta_detail
                beta_detail_state = if detail
                                      "internalState=#{detail.internal_build_state} " \
                                      "externalState=#{detail.external_build_state} " \
                                      "autoNotify=#{detail.auto_notify_enabled} didNotify=#{detail.did_notify}"
                                    else
                                      "betaDetail=missing"
                                    end
                puts(
                  "- #{safely { build.app_version }} (#{build.version}) " \
                  "id=#{build.id} state=#{build.processing_state} expired=#{build.expired} " \
                  "usesNonExemptEncryption=#{build.uses_non_exempt_encryption.inspect} " \
                  "internalReady=#{safely { build.ready_for_internal_testing? }} " \
                  "betaReviewReady=#{safely { build.ready_for_beta_submission? }} " \
                  "missingExportCompliance=#{safely { build.missing_export_compliance? }} " \
                  "#{beta_detail_state}"
                )
                print_build_bundles(build) if bool_input?(ENV["DIAGNOSE_BUNDLES"])
              end
            end
            puts "::endgroup::"
            builds
          end

          def print_build_bundles(build)
            bundles = build.build_bundles || []
            puts "::group::Apple-processed build bundles"
            if bundles.empty?
              puts "No build bundle metadata returned."
            else
              bundles.each do |bundle|
                puts(
                  "- bundleId=#{describe(bundle.bundle_id)} type=#{describe(bundle.bundle_type)} " \
                  "sdkBuild=#{describe(bundle.sdk_build)} platformBuild=#{describe(bundle.platform_build)} " \
                  "fileName=#{describe(bundle.file_name)} architectures=#{describe(bundle.supported_architectures)} " \
                  "requiredCapabilities=#{describe(bundle.required_capabilities)} " \
                  "deviceProtocols=#{describe(bundle.device_protocols)} " \
                  "locationServices=#{describe(bundle.uses_location_services)} " \
                  "prerenderedIcon=#{describe(bundle.has_prerendered_icon)}"
                )
                puts "  entitlements=#{describe(bundle.entitlements)}"
              end
            end
            puts "::endgroup::"
          rescue => e
            puts "Build bundle metadata unavailable: #{e.class}"
            puts "::endgroup::"
          end

          def print_groups(app)
            groups = app.get_beta_groups
            puts "::group::TestFlight groups"
            if groups.empty?
              puts "No TestFlight groups found."
            else
              groups.each do |group|
                builds = safely { group.fetch_builds }
                build_summary = if builds.is_a?(Array)
                                  builds.map { |build| "#{safely { build.version }}:#{safely { build.id }}" }.join(",")
                                else
                                  builds.to_s
                                end
                puts(
                  "- #{group.name} id=#{group.id} internal=#{group.is_internal_group} " \
                  "publicLinkEnabled=#{group.public_link_enabled} allBuilds=#{group.has_access_to_all_builds} " \
                  "builds=#{build_summary}"
                )
              end
            end
            puts "::endgroup::"
            groups
          end

          def print_testers(app)
            testers = app.get_beta_testers(limit: 200)
            puts "::group::TestFlight testers"
            if testers.empty?
              puts "No TestFlight testers found for this app."
            else
              testers.each do |tester|
                puts(
                  "- #{redact_email(tester.email)} state=#{describe(tester.beta_tester_state)} " \
                  "inviteType=#{describe(tester.invite_type)} deleted=#{describe(tester.is_deleted)} " \
                  "devices=#{describe(tester.number_of_installed_devices)} " \
                  "installed=#{describe(tester.installed_cf_bundle_short_version_string)}" \
                  "(#{describe(tester.installed_cf_bundle_version)}) " \
                  "latest=#{describe(tester.latest_expiring_cf_bundle_short_version_string)}" \
                  "(#{describe(tester.latest_expiring_cf_bundle_version_string)})"
                )
              end
            end
            puts "::endgroup::"
            testers
          end

          def print_beta_app_test_info(app)
            localizations = app.get_beta_app_localizations
            localization = localizations.find { |item| item.locale == "en-US" } || localizations.first
            description_configured = !localization&.description.to_s.strip.empty?
            feedback_email_configured = !localization&.feedback_email.to_s.strip.empty?

            puts "::group::Beta App test info"
            if localization
              puts(
                "- locale=#{localization.locale} " \
                "descriptionConfigured=#{description_configured} " \
                "feedbackEmailConfigured=#{feedback_email_configured}"
              )
              if description_configured && feedback_email_configured
                puts "Beta App test info already has description and feedback email."
              end
            else
              puts "No Beta App localization found."
            end
            puts "::endgroup::"
          end

          def fetch_beta_app_review_detail(app)
            response = Spaceship::ConnectAPI.get_beta_app_review_detail(
              filter: { app: app.id },
              limit: 1
            )
            response.all_pages.flat_map(&:to_models).first
          end

          def field_configured?(value)
            !value.to_s.strip.empty?
          end

          def print_beta_app_review_detail(app)
            detail = fetch_beta_app_review_detail(app)

            puts "::group::Beta App review detail"
            if detail
              puts(
                "- id=#{detail.id} " \
                "contactFirstNameConfigured=#{field_configured?(detail.contact_first_name)} " \
                "contactLastNameConfigured=#{field_configured?(detail.contact_last_name)} " \
                "contactEmailConfigured=#{field_configured?(detail.contact_email)} " \
                "contactPhoneConfigured=#{field_configured?(detail.contact_phone)} " \
                "demoAccountRequired=#{detail.demo_account_required.inspect} " \
                "notesConfigured=#{field_configured?(detail.notes)}"
              )
            else
              puts "No Beta App review detail found."
            end
            puts "::endgroup::"
            detail
          end

          def create_tester_assignments!(groups, emails)
            raise "No TestFlight tester emails are available for assignment" if emails.empty?

            group_ids = groups.map(&:id)
            emails.each do |email|
              Spaceship::ConnectAPI.post_beta_tester_assignment(
                beta_group_ids: group_ids,
                attributes: { email: email, firstName: "AI", lastName: "Caddie" }
              )
            end
            groups.each do |group|
              puts(
                "Assigned #{emails.length} external tester(s) to group #{group.name}: " \
                "#{emails.map { |email| redact_email(email) }.join(', ')}"
              )
            end
          end

          def tester_assignment_blocked?(error)
            error.message.include?("Tester(s) cannot be assigned")
          end

          def assign_existing_testers_to_groups!(groups, testers)
            raise "No existing app-level TestFlight testers were found for assignment" if testers.empty?

            tester_ids = testers.map(&:id).map(&:to_s).reject(&:empty?).uniq
            raise "Existing app-level TestFlight testers did not include usable tester ids" if tester_ids.empty?

            assignment_failures = []
            emails = testers.map { |tester| tester.email.to_s.strip }.reject(&:empty?).uniq
            groups.each do |group|
              begin
                Spaceship::ConnectAPI.add_beta_tester_to_group(
                  beta_group_id: group.id,
                  beta_tester_ids: tester_ids
                )
              rescue Spaceship::UnexpectedResponse => e
                raise unless tester_assignment_blocked?(e)

                assignment_failures << group.name
                puts(
                  "Tester assignment blocked for group #{group.name}: " \
                  "App Store Connect reported testers cannot be assigned."
                )
                next
              end
              puts(
                "Assigned #{tester_ids.length} external tester(s) to group #{group.name}: " \
                "#{emails.map { |email| redact_email(email) }.join(', ')}"
              )
            end
            if assignment_failures.any?
              raise(
                "Existing tester assignment blocked for group(s): " \
                "#{assignment_failures.join(', ')}. Run list to inspect build, group, and tester state."
              )
            end
          end

          def internal_testflight_group?(group)
            group.is_internal_group == true
          end

          def ensure_testflight_groups(app, names, external:)
            existing = app.get_beta_groups
            names.map do |name|
              group = existing.find { |candidate| candidate.name == name }
              if group
                if external
                  if internal_testflight_group?(group)
                    raise(
                      "External TestFlight operations require an external group; " \
                      "#{name.inspect} is an internal group."
                    )
                  end
                elsif !internal_testflight_group?(group)
                  raise(
                    "TestFlight group #{name.inspect} is external. " \
                    "Set external_distribution=true to opt in to external distribution."
                  )
                end
                puts(
                  "TestFlight group already exists: #{name} " \
                  "(internal=#{internal_testflight_group?(group)})"
                )
              elsif external
                puts "Creating external TestFlight group: #{name}"
                group = app.create_beta_group(group_name: name)
                raise "Failed to create TestFlight group: #{name}" unless group

                existing << group
              else
                raise(
                  "Required internal TestFlight group #{name.inspect} was not found. " \
                  "Refusing to create an external group; create the internal group in " \
                  "App Store Connect first."
                )
              end

              group
            end
          end

          def require_external_distribution!(enabled, operation)
            return if enabled

            raise(
              "External TestFlight operation #{operation.inspect} is disabled by default. " \
              "Re-run with external_distribution=true to opt in."
            )
          end

          def select_distributable_build!(app, app_version, build_number)
            builds = fetch_builds(app, app_version, build_number, limit: 30)
            raise "No TestFlight build found for the requested version/build." if builds.empty?

            build = if app_version || build_number
                      builds.first
                    else
                      builds.find do |candidate|
                        candidate.processing_state == Spaceship::ConnectAPI::Build::ProcessingState::VALID
                      end || builds.first
                    end

            unless build.processing_state == Spaceship::ConnectAPI::Build::ProcessingState::VALID
              raise(
                "Selected build #{safely { build.app_version }} (#{build.version}) is " \
                "#{build.processing_state}, not VALID yet."
              )
            end

            build
          end

          def mark_export_compliance!(build)
            if build.uses_non_exempt_encryption == false
              puts "Export compliance already set: usesNonExemptEncryption=false."
            else
              puts "Setting export compliance: usesNonExemptEncryption=false."
              build.update(attributes: { uses_non_exempt_encryption: false })
            end
          end

          def set_auto_notify!(build, notify_external_testers)
            detail = build.build_beta_detail
            if detail
              Spaceship::ConnectAPI.patch_build_beta_details(
                build_beta_details_id: detail.id,
                attributes: { autoNotifyEnabled: notify_external_testers }
              )
              puts "External tester auto-notify set to #{notify_external_testers}."
            else
              puts "No build beta detail is available yet; auto-notify was not changed."
            end
          end

          def ensure_beta_app_test_info!(app, feedback_email)
            localizations = app.get_beta_app_localizations
            localization = localizations.find { |item| item.locale == "en-US" } || localizations.first

            existing_description = localization&.description.to_s.strip
            existing_feedback_email = localization&.feedback_email.to_s.strip
            missing_feedback_email = existing_feedback_email.empty? && feedback_email.to_s.strip.empty?
            if missing_feedback_email
              raise(
                "External TestFlight distribution requires Beta App feedback email. " \
                "Set repo secret TESTFLIGHT_FEEDBACK_EMAIL or fill Beta App feedback email in App Store Connect."
              )
            end

            attributes = {}
            attributes[:description] = DEFAULT_BETA_APP_DESCRIPTION if existing_description.empty?
            if existing_feedback_email.empty?
              attributes[:feedbackEmail] = feedback_email.to_s.strip
            end

            if attributes.empty?
              puts "Beta App test info already has description and feedback email."
              return
            end

            if localization
              Spaceship::ConnectAPI.patch_beta_app_localizations(
                localization_id: localization.id,
                attributes: attributes
              )
              puts "Beta App test info updated on existing #{localization.locale} localization."
            else
              Spaceship::ConnectAPI.post_beta_app_localizations(
                app_id: app.id,
                attributes: attributes.merge(locale: "en-US")
              )
              puts "Beta App test info created for en-US localization."
            end
          end

          def review_contact_inputs(feedback_email)
            {
              contactEmail: blank_to_nil(ENV["TESTFLIGHT_REVIEW_CONTACT_EMAIL"]) || feedback_email,
              contactFirstName: blank_to_nil(ENV["TESTFLIGHT_REVIEW_CONTACT_FIRST_NAME"]),
              contactLastName: blank_to_nil(ENV["TESTFLIGHT_REVIEW_CONTACT_LAST_NAME"]),
              contactPhone: blank_to_nil(ENV["TESTFLIGHT_REVIEW_CONTACT_PHONE"])
            }
          end

          def ensure_beta_app_review_detail!(app, feedback_email)
            detail = fetch_beta_app_review_detail(app)
            inputs = review_contact_inputs(feedback_email)
            contact_email = detail&.contact_email
            contact_first_name = detail&.contact_first_name
            contact_last_name = detail&.contact_last_name
            contact_phone = detail&.contact_phone

            missing = []
            missing << "contactEmail / TESTFLIGHT_REVIEW_CONTACT_EMAIL or TESTFLIGHT_FEEDBACK_EMAIL" if !field_configured?(contact_email) && inputs[:contactEmail].nil?
            missing << "contactFirstName / TESTFLIGHT_REVIEW_CONTACT_FIRST_NAME" if !field_configured?(contact_first_name) && inputs[:contactFirstName].nil?
            missing << "contactLastName / TESTFLIGHT_REVIEW_CONTACT_LAST_NAME" if !field_configured?(contact_last_name) && inputs[:contactLastName].nil?
            missing << "contactPhone / TESTFLIGHT_REVIEW_CONTACT_PHONE" if !field_configured?(contact_phone) && inputs[:contactPhone].nil?

            if missing.any?
              raise(
                "External TestFlight distribution requires Beta App Review contact fields: " \
                "#{missing.join(', ')}. Set repo secrets or fill Beta App Review Information in App Store Connect."
              )
            end

            attributes = {}
            attributes[:contactEmail] = inputs[:contactEmail] if !field_configured?(contact_email)
            attributes[:contactFirstName] = inputs[:contactFirstName] if !field_configured?(contact_first_name)
            attributes[:contactLastName] = inputs[:contactLastName] if !field_configured?(contact_last_name)
            attributes[:contactPhone] = inputs[:contactPhone] if !field_configured?(contact_phone)
            attributes[:demoAccountRequired] = false if detail&.demo_account_required.nil?
            attributes[:notes] = DEFAULT_BETA_APP_REVIEW_NOTES unless field_configured?(detail&.notes)

            if attributes.empty?
              puts "Beta App Review details already have required contact info."
              return detail
            end

            Spaceship::ConnectAPI.patch_beta_app_review_detail(
              app_id: detail&.id || app.id,
              attributes: attributes
            )
            puts(
              "Beta App Review details updated: " \
              "#{attributes.keys.map(&:to_s).join(', ')}."
            )
            fetch_beta_app_review_detail(app)
          end

          def beta_metadata_pending?(message)
            message.include?("Beta App Description is missing") ||
              message.include?("betaAppLocalizations not found") ||
              message.include?("Missing required information to submit for external testing")
          end

          def submit_beta_review_if_ready!(build, app)
            ready = safely { build.ready_for_beta_submission? }
            unless ready == true
              puts "Beta App Review submission skipped: ready_for_beta_submission=#{ready.inspect}."
              return
            end

            3.times do |attempt|
              puts "Submitting build for Beta App Review."
              begin
                build.post_beta_app_review_submission
                puts "Beta App Review submission requested."
                return
              rescue Spaceship::UnexpectedResponse => e
                raise unless beta_metadata_pending?(e.message) && attempt < 2

                puts "Beta App metadata is not visible to review submission yet; retrying."
                ensure_beta_app_test_info!(app, blank_to_nil(ENV["TESTFLIGHT_FEEDBACK_EMAIL"]))
                ensure_beta_app_review_detail!(app, blank_to_nil(ENV["TESTFLIGHT_FEEDBACK_EMAIL"]))
                sleep 10
              end
            end
          end

          operation = ENV.fetch("OPERATION", "list")
          external_distribution = bool_input?(ENV["EXTERNAL_DISTRIBUTION"])
          internal_group_name = blank_to_nil(ENV["INTERNAL_TESTFLIGHT_GROUP"]) || DEFAULT_INTERNAL_TESTFLIGHT_GROUP
          external_group_names = parse_group_names(ENV["TESTFLIGHT_GROUPS"], default_name: DEFAULT_EXTERNAL_TESTFLIGHT_GROUP)
          app_version = blank_to_nil(ENV["APP_VERSION"])
          build_number = blank_to_nil(ENV["BUILD_NUMBER"])
          feedback_email = blank_to_nil(ENV["TESTFLIGHT_FEEDBACK_EMAIL"])
          notify_external_testers = bool_input?(ENV["NOTIFY_EXTERNAL_TESTERS"])

          connect_api!
          app = find_app!
          puts "App Store Connect app: #{safely { app.name }} (#{APP_IDENTIFIER}, id=#{app.id})"

          case operation
          when "list"
            print_builds(app, app_version, build_number)
            print_groups(app)
            print_testers(app)
            print_beta_app_test_info(app)
            print_beta_app_review_detail(app)
          when "add"
            require_external_distribution!(external_distribution, operation)
            emails = parse_tester_emails(ENV["TESTER_EMAILS"])
            raise "tester_emails is required for add" if emails.empty?

            groups = ensure_testflight_groups(app, external_group_names, external: true)
            create_tester_assignments!(groups, emails)
          when "assign_existing"
            require_external_distribution!(external_distribution, operation)
            groups = ensure_testflight_groups(app, external_group_names, external: true)
            testers = app.get_beta_testers(limit: 200)
            assign_existing_testers_to_groups!(groups, testers)
          when "configure_review"
            require_external_distribution!(external_distribution, operation)
            ensure_beta_app_test_info!(app, feedback_email)
            ensure_beta_app_review_detail!(app, feedback_email)
            print_beta_app_test_info(app)
            print_beta_app_review_detail(app)
          when "submit_review"
            require_external_distribution!(external_distribution, operation)
            build = select_distributable_build!(app, app_version, build_number)
            puts "Selected build: #{safely { build.app_version }} (#{build.version}), id=#{build.id}."
            mark_export_compliance!(build)
            ensure_beta_app_test_info!(app, feedback_email)
            ensure_beta_app_review_detail!(app, feedback_email)
            submit_beta_review_if_ready!(build, app)
          when "distribute"
            build = select_distributable_build!(app, app_version, build_number)
            puts "Selected build: #{safely { build.app_version }} (#{build.version}), id=#{build.id}."
            if external_distribution
              groups = ensure_testflight_groups(app, external_group_names, external: true)
              mark_export_compliance!(build)
              set_auto_notify!(build, notify_external_testers)
              ensure_beta_app_test_info!(app, feedback_email)
              ensure_beta_app_review_detail!(app, feedback_email)
              submit_beta_review_if_ready!(build, app)
            else
              groups = ensure_testflight_groups(app, [internal_group_name], external: false)
            end
            build.add_beta_groups(beta_groups: groups)
            puts(
              "Assigned build #{safely { build.app_version }} (#{build.version}) to " \
              "#{external_distribution ? 'external' : 'existing internal'} group(s): " \
              "#{groups.map(&:name).join(', ')}"
            )
          else
            raise "Unsupported operation: #{operation}"
          end
          RUBY

  artifact_diagnostics:
    if: ${{ github.event.inputs.operation == 'diagnose_artifact' }}
    uses: ./.github/workflows/ios-testflight-artifact-diagnostics.yml
    with:
      source_run_id: ${{ github.event.inputs.source_run_id }}
      artifact_name: AICaddie-ipa

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ai-caddie-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AI_CADDIE_DATA_MODE: fixture
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          # The fixture API is launched via `uv run uvicorn ... &` below and the
          # orphaned `uv` parent holds the cache lock, so the default post-job
          # `uv cache prune` deadlocks (5 min hang -> exit 2). Skip the prune.
          prune-cache: false
      - name: Install Python dependencies
        # --frozen: fail if uv.lock has drifted from pyproject.toml, matching how the Docker
        # images install (uv sync --frozen). Keeps CI and the deployed image byte-identical (P1-7).
        run: uv sync --frozen
      - name: Resolve canonical authority diff base
        id: canonical-authority-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            test -n "$PR_BASE_SHA"
            echo "range=${PR_BASE_SHA}...HEAD" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            echo "range=${PUSH_BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          else
            git rev-parse HEAD^ >/dev/null
            echo "range=HEAD^..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Check canonical contract authority
        env:
          AUTHORITY_RANGE: ${{ steps.canonical-authority-base.outputs.range }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$AUTHORITY_RANGE" | uv run python tools/contracts/check_authority.py
      - name: Compile Python sources
        run: uv run python -m py_compile $(git ls-files '*.py')
      - name: Run backend tests
        run: uv run python -m unittest discover -s tests -t . -v
      - name: Start fixture API
        env:
          AI_CADDIE_SECURITY_PROFILE: private
          AI_CADDIE_ADMIN_TOKEN: ci-admin-token
        run: |
          # Exercise the exact production cold-start order on a genuinely absent identity DB before
          # serving: migration -> idempotent registry seed -> Apple auth -> API process.
          export AI_CADDIE_DATABASE_URL="sqlite:///$RUNNER_TEMP/identity-cold-start.db"
          rm -f "$RUNNER_TEMP/identity-cold-start.db"
          uv run --frozen alembic upgrade head
          uv run --frozen python -m server_v2.identity_seed
          uv run --frozen python - <<'PY'
          from unittest.mock import patch

          from fastapi.testclient import TestClient

          from server_v2.apple_auth import AppleIdentity
          from server_v2.main import app

          with patch(
              "server_v2.auth_api._verify",
              return_value=AppleIdentity(subject="ci-cold-start-subject", email="ci@example.test"),
          ):
              with TestClient(app) as client:
                  response = client.post(
                      "/api/v2/auth/apple",
                      json={"identityToken": "ci-stubbed-token", "displayName": "CI Member"},
                  )
          if response.status_code != 200:
              raise SystemExit(f"cold-start Apple auth failed: {response.status_code} {response.text}")
          payload = response.json()
          if not payload.get("token") or not payload.get("playerId"):
              raise SystemExit("cold-start Apple auth returned no scoped session/player identity")
          PY
          uv run uvicorn server_v2.main:app --host 127.0.0.1 --port 9000 > /tmp/ai-caddie-api.log 2>&1 &
          echo $! > /tmp/ai-caddie-api.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:9000/api/v2/health && exit 0
            sleep 1
          done
          cat /tmp/ai-caddie-api.log
          exit 1
      - name: Private trial smoke
        env:
          AI_CADDIE_SECURITY_PROFILE: private
          AI_CADDIE_ADMIN_TOKEN: ci-admin-token
        run: ops/smoke_private_trial.sh http://127.0.0.1:9000
      - name: Stop fixture API
        if: always()
        run: |
          if [ -f /tmp/ai-caddie-api.pid ]; then
            kill "$(cat /tmp/ai-caddie-api.pid)" 2>/dev/null || true
          fi
          pkill -f 'uvicorn server_v2.main:app' 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_v2/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run component tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run visual smoke
        run: npm run test:e2e

  docker:
    # P1-7: nothing used to build the Docker images, so the deployed runtime — especially the sync
    # image's pipeline — could silently drift from the code (exactly how the club-bag sync broke for
    # 10 days). Build BOTH images every PR and smoke-test the API container, so a Dockerfile /
    # start_api.sh / runtime-path regression fails here instead of in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the same named dependency layers used by ops/agenthub_deploy.py;
      # the application stages below only copy source on top of these images.
      - name: Build API dependency image
        run: |
          API_DEPS_HASH="$(python3 -c 'from ops.agenthub_deploy import api_dependency_hash; print(api_dependency_hash())')"
          echo "API_DEPS_HASH=$API_DEPS_HASH" >> "$GITHUB_ENV"
          docker build -f Dockerfile.deps --label "ai.caddie.dependencies-hash=$API_DEPS_HASH" -t garmin-ai-caddie-deps:ci .
      - name: Build sync dependency image
        run: |
          SYNC_DEPS_HASH="$(python3 -c 'from ops.agenthub_deploy import sync_dependency_hash, api_dependency_hash; print(sync_dependency_hash(api_dependency_hash()))')"
          docker build -f Dockerfile.sync-deps --build-arg API_IMAGE=garmin-ai-caddie-deps:ci \
            --label "ai.caddie.dependencies-hash=$SYNC_DEPS_HASH" \
            --label "ai.caddie.api-dependencies-hash=$API_DEPS_HASH" \
            -t aicaddie-sync-deps:ci .
      - name: Build API image
        run: docker build -f Dockerfile --build-arg DEPS_IMAGE=garmin-ai-caddie-deps:ci -t garmin-ai-caddie-api:latest .
      - name: Collect readiness runtime paths from the checkout
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP:/evidence" -w /src garmin-ai-caddie-api:latest \
            /app/.venv/bin/python ops/readiness_runtime_paths.py collect --root /src --output /evidence/readiness-runtime-paths.json
      - name: Verify readiness runtime paths inside the built API image
        run: |
          docker run --rm -i garmin-ai-caddie-api:latest \
            /app/.venv/bin/python /app/ops/readiness_runtime_paths.py verify --manifest - --image-root /app < "$RUNNER_TEMP/readiness-runtime-paths.json"
      - name: Build sync image (thin extension of the API image — keeps the sync pipeline from drifting)
        run: docker build -f Dockerfile.sync --build-arg SYNC_DEPS_IMAGE=aicaddie-sync-deps:ci --build-arg API_IMAGE=garmin-ai-caddie-api:latest -t aicaddie-sync:latest .
      - name: API container — start, health, and geometry read smoke
        run: |
          # AI_CADDIE_ALLOW_OPEN=1 lets the API start with no security profile AND exercises the
          # start_api.sh fail-closed guard (P0-1); fixture data avoids needing real Garmin state.
          docker run -d --name aicaddie-api -p 9000:9000 \
            -e AI_CADDIE_ALLOW_OPEN=1 -e AI_CADDIE_DATA_MODE=fixture \
            garmin-ai-caddie-api:latest
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/api/v2/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs aicaddie-api; exit 1; fi
          # Exercise the packaged canonical schema registry and immutable typed-ID golden inside the
          # production image, where repo-relative runtime resources must resolve under /app.
          docker exec -i aicaddie-api /app/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          from ai_caddie.contracts.typed_ids import typed_id

          fixture_path = Path("/app/contracts/canonical/fixtures/canonical_json_v1.json")
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          for domain, expected in fixture["typedIds"].items():
              actual = typed_id(domain, fixture["value"])
              if actual != expected:
                  raise SystemExit(f"typed ID mismatch for {domain}: {actual} != {expected}")
          PY
          # Readiness imports these mobile contracts at runtime; keep the image and
          # the repository's contract paths in lockstep.
          docker exec aicaddie-api sh -eu -c '
            test -s /app/mobile/contracts/live_round_package.schema.json
            test -s /app/mobile/contracts/live_round_event.schema.json
          '
          # The geometry read path resolves ROOT and imports the node-subprocess toolchain inside the
          # container; with no data it must return a STRUCTURED response, never a 500 crash.
          code=$(curl -s -o /tmp/geo.json -w '%{http_code}' --max-time 30 http://127.0.0.1:9000/api/v2/geometry/hole/31795/1)
          cat /tmp/geo.json || true
          if [ "$code" = "500" ]; then echo "geometry read 500'd"; docker logs aicaddie-api; exit 1; fi
      - name: Stop API container
        if: always()
        run: docker rm -f aicaddie-api 2>/dev/null || true
